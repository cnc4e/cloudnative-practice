issues:
  - title: EKSクラスタエンドポイントのアクセス制御
    body: |
      EKSクラスタのAPIサーバー（コントロールプレーン）へのアクセス経路を制御することで、意図しないネットワークからの操作を防ぎ、セキュリティを向上させることができます。EKSクラスタのエンドポイントには「パブリック」「プライベート」「パブリック+プライベート（混合）」の3種類があり、それぞれアクセス経路や運用上の特性が異なります。

      [クラスター API サーバーエンドポイント](https://docs.aws.amazon.com/ja_jp/eks/latest/userguide/cluster-endpoint.html)

      ## アクセスモードの種類

      ### パブリックエンドポイント（デフォルト）
      - インターネット経由でAPIサーバーにアクセス可能
      - APIサーバーにパブリックIPアドレスが割り当てられる
      - アクセスを許可するCIDRブロックを指定して制限できる（未指定の場合は全世界からアクセス可能な状態になる）

      ### プライベートエンドポイント
      - VPC内からのみAPIサーバーにアクセス可能
      - APIサーバーにVPC内のプライベートIPアドレスが割り当てられる
      - クラスタに割り当てられたセキュリティグループでアクセス制御が可能

      ### パブリック + プライベート（混合モード）
      - 両方のエンドポイントを同時に有効化できるモード
      - VPC内はプライベート経路、VPC外はパブリック経路（CIDR制限付き）でアクセスするなど柔軟な制御が可能
      - パブリックからプライベートへの移行など、段階的な運用変更にも適している

      ## セキュリティ上の考慮事項

      ### パブリックエンドポイントを使用する場合
      - 許可するCIDRブロックを必ず設定し、アクセス元を制限する
      - 自組織が利用するグローバルIPアドレスのみを許可する
      - `0.0.0.0/0`（全世界へのアクセス許可）は避ける

      ### プライベートエンドポイントを使用する場合
      - VPC内にAPIサーバー用のENI（Elastic Network Interface）が作成される
      - ワーカーノードからクラスターへの通信がVPC内で完結し、外部への経路が生まれない
      - 作成されたENIにはEKSクラスタのセキュリティグループが適用され、そこでアクセス制御を行う

      ## 運用上の注意点

      ### パブリックエンドポイント使用時
      - VPC外で動くCI/CDパイプラインからもアクセスしやすい
      - オフィスや自宅など、外部の端末からの管理操作も行いやすい

      ### プライベートエンドポイント使用時
      - CI/CDはVPC内のリソースから実行する必要がある
      - 管理者もVPC内のbastion hostやVPN接続経由でのアクセスが必要になる

      ## アクセスモードの変更（移行）について

      パブリック⇔プライベートの切り替えは後から可能ですが、以下の点に注意してください。
      - 変更後のモードに合わせて、CI/CDパイプラインや作業端末からのアクセス経路を見直す必要がある
      - 切り替えによってDNS解決の挙動（返却されるIPアドレスの種類）が変わる

      # プラクティス
      - EKSクラスタのエンドポイント設定を確認・変更する
        - 作業端末がEKSと同じネットワークの場合
          - EKSのパブリックエンドポイントを無効にする
          - クラスタのセキュリティグループに作業端末のIPアドレスを追加
        - 作業端末がEKS外部のネットワークの場合
          - EKSのパブリックエンドポイントを有効にする
          - エンドポイントのアクセス制限で作業端末のIPアドレスを許可する

  - title: EKSアクセスエントリーによる認証・認可の管理
    body: |
      # EKSアクセスエントリーによる認証・認可の管理
      EKSアクセスエントリー（Access Entry）は、EKSクラスタへのアクセス管理をAWS APIベースで行う仕組みです。従来のaws-auth ConfigMapに代わる新しいアクセス管理手法として、より安全で運用しやすい方法を提供します。

      [EKS アクセスエントリを使用して Kubernetes へのアクセスを IAM ユーザーに許可する](https://docs.aws.amazon.com/ja_jp/eks/latest/userguide/access-entries.html)

      ## アクセスエントリーの概要

      ### 従来の課題（aws-auth ConfigMap）
      - IAMプリンシパルとKubernetesユーザー/グループのマッピングをConfigMapへ直接記述する必要があり、運用が複雑
      - YAMLの記述ミス一つでクラスタへのアクセスを喪失するリスクがある
      - IAMユーザー/ロールとKubernetesユーザーの対応関係がConfigMapの中身を見ないと分かりにくい

      ### アクセスエントリーの利点
      - AWS API（`CreateAccessEntry`等）を通じて管理できるため運用が簡素化される
      - IAMロール/ユーザーとKubernetes権限の関連付けが明確になる
      - Terraformなどのインフラコードでライフサイクル管理がしやすい
      - ConfigMapの誤編集によるクラスタアクセス喪失のリスクを軽減できる

      ## アクセスエントリーの種類

      ### 標準アクセスエントリー（STANDARD）
      typeを省略した場合のデフォルトで、人やCI/CDなど「クラスタを利用する側」のIAMユーザー/ロール1つに対して作成するアクセスエントリーです。権限の付け方は次の2通りがあり、併用も可能です。

      - **Kubernetesグループを指定する** - あらかじめ作成した`RoleBinding`/`ClusterRoleBinding`のsubjectにグループ名を紐付け、Kubernetes RBACで権限を制御する
      - **EKS管理ポリシーをアタッチする** - `AmazonEKSViewPolicy`等のポリシーをエントリーに関連付け、EKS側で権限を制御する（RBACオブジェクトの作成は不要）

      ### EKS管理ポリシー
      AWSが提供する定義済みポリシー：
      - `AmazonEKSClusterAdminPolicy` - クラスタ管理者権限
      - `AmazonEKSAdminPolicy` - 標準管理者権限
      - `AmazonEKSEditPolicy` - リソース編集権限
      - `AmazonEKSViewPolicy` - 読み取り専用権限

      ## セキュリティのベストプラクティス

      ### 最小権限の原則
      - ユーザー/ロールに必要最小限の権限のみ付与する
      - 開発・ステージング・本番環境で権限を分離する
      - 一時的なアクセスには期限付きロールを使用する

      ### ロールベースの管理
      - 個人ユーザーではなくIAMロールを使用する
      - 部署・チーム単位でロールを分割する
      - 外部IDプロバイダーとの連携（OIDC/SAML）を検討する

      # プラクティス
      - EKSクラスタにアクセスエントリーを設定するTerraformコードを作成する
        - 任意の追加のIAMユーザー/ロールのアクセスエントリーを作成する
        - 上記アクセスエントリーに任意のポリシーを適用する

  - title: EKSクラスタの監査ログ有効化
    body: |
      # EKSクラスタの監査ログ有効化
      EKSクラスタの監査ログ（Audit Log）を有効化することで、クラスタ内で発生したすべてのAPI操作を記録し、セキュリティインシデントの調査や法令遵守（コンプライアンス）に役立てることができます。

      ## 監査ログの必要性
      - 監査ログがないと、誰が・いつ・何を実行したかを後から追跡できず、不正操作や設定ミスが起きても原因の特定が困難
      - セキュリティインシデント発生時、被害範囲の特定や影響調査に監査ログが不可欠
      - コンプライアンス要件（操作履歴の保持など）を満たすために監査ログの保管が求められる場合がある
      - Amazon GuardDuty EKS Protectionなど、監査ログを分析して脅威を検知するサービスを活用する前提として監査ログの有効化が必要

      [Amazon EKS コントロールプレーンのログ記録](https://docs.aws.amazon.com/ja_jp/eks/latest/userguide/control-plane-logs.html)

      ## 監査ログの概要

      ### EKSで有効化できるログタイプ
      - **api** - Kubernetes API サーバーのログ
      - **audit** - Kubernetes 監査ログ（重要）
      - **authenticator** - AWS IAM Authenticator のログ
      - **controllerManager** - Kubernetes コントローラーマネージャーのログ
      - **scheduler** - Kubernetes スケジューラーのログ

      これら5種類のログタイプはいずれもデフォルトで無効になっており、タイプごとに個別に有効化する必要があります。本プラクティスでは、このうち`audit`（監査ログ）を有効化します。

      ## 監査ログで記録される情報

      ### リクエスト情報
      - APIエンドポイント（例：/api/v1/pods）
      - HTTPメソッド（GET、POST、PUT、DELETE）
      - リクエスト元のユーザー情報
      - アクセス元のIPアドレス
      - リクエスト時刻とレスポンス時刻

      ### 認証・認可情報
      - IAMユーザー/ロール情報
      - Kubernetesユーザー/グループ情報
      - 認可の成功/失敗状況

      ### リソース操作情報
      - 操作対象のKubernetesリソース
      - 作成・変更・削除されたオブジェクトの詳細
      - リクエスト結果（成功・失敗）

      ## CloudWatch Logsでの監査ログ分析

      ### ログストリーム構成
      監査ログは以下の形式でCloudWatchのロググループに出力されます。EKSはロググループが存在しない場合自動的に作成しますが、自動作成されたロググループには保持期限（有効期限）が設定されないため、ログが無期限に保持されコストが増え続けてしまいます。事前に手動でロググループを作成し、要件に応じた保持期限（例：90日、1年など）を設定しておくことを推奨します。
      ```
      /aws/eks/<cluster-name>/cluster
      ```

      調査の際は、CloudWatch Logs Insightsを使うとクエリによる柔軟な検索・分析が可能です。

      # プラクティス
      - eksモジュールを拡張する
        - EKSクラスタのログを出力するCloudWatch Logsのロググループを作成する
          - 任意の保持期限（有効期限）を設定する
        - EKSクラスタで監査ログを有効化する
          - cluster loggingの設定し監査ログ（audit）を出力させる
          - (監査ログ以外も任意で有効にして良い)

      # 更に発展的なプラクティス
      このプラクティスは余裕がなければやらなくてもいいです。

      - EKSクラスタの監査ログをS3バケットに出力する
        - CloudWatch LogsからS3バケットへのエクスポートを設定する
      - S3の監査ログの分析をAthenaで行う

  - title: Kubernetes NetworkPolicyによるネットワークセキュリティ
    body: |
      Kubernetes NetworkPolicyは、Pod間の通信を制御するセキュリティ機能です。デフォルトでは、すべてのPod間通信が許可されているため、NetworkPolicyを使用してネットワークレベルでのセグメンテーションを実装することで、セキュリティを大幅に向上させることができます。

      [ネットワークポリシー](https://kubernetes.io/ja/docs/concepts/services-networking/network-policies/)

      ## NetworkPolicyの概要

      ### デフォルトの動作
      - Kubernetesクラスタでは、すべてのPod間通信がデフォルトで許可
      - 異なるNamespace間でも自由に通信可能
      - セキュリティリスクが高い状態

      ### NetworkPolicyによる制御
      - Pod間の通信を明示的に制御
      - 送信（Egress）と受信（Ingress）トラフィックの制御
      - ラベルセレクターによる柔軟な対象選択

      ## NetworkPolicyの基本概念

      ### ポリシータイプ
      - **Ingress** - Podへの着信通信を制御
      - **Egress** - Podからの発信通信を制御
      - 両方を組み合わせて使用可能

      ### セレクター
      - **podSelector** - 対象となるPodを選択
      - **namespaceSelector** - 対象となるNamespaceを選択
      - **ipBlock** - CIDR範囲でのIP制御

      ## EKSでのPodの通信制御

      EKSでは従来より Security Groups for Pods を使用してPodの通信を制御することができました。[セキュリティグループを個別の Pod に割り当てる](https://docs.aws.amazon.com/ja_jp/eks/latest/userguide/security-groups-for-pods.html)

      しかし、EKS Auto Modeではサポートされていません。[EKS 自動モードl での VPC ネットワーキングとロードバランシングの説明](https://docs.aws.amazon.com/ja_jp/eks/latest/userguide/auto-networking.html)

      代わりに EKS Auto Mode では Networkpolicy がサポートされています。[EKS Auto Mode でネットワークポリシーを使用する](https://docs.aws.amazon.com/ja_jp/eks/latest/userguide/auto-net-pol.html)

      # プラクティス
      - ネットワークポリシーコントローラーを有効にするConfigMapを作成する
        - コードは`eks/k8s`ディレクトリに格納
      - NetworkPolicyを使用したセキュリティ制御の実装
        - frontend はVPCのCIDRからのみアクセスを許可
        - backend は frontend からのみアクセスを許可

  - title: EKSのSecurity Groups for Podsによるセキュリティ制御
    body: |
      **本issueは内容を確認するだけでクローズしてください。**
      # EKSのSecurity Groups for Podsによるセキュリティ制御

      Security Groups for Podsは、AWS EKSにおいてPodレベルでネットワークセキュリティを制御する機能です。通常、セキュリティグループ（SG）はノード（EC2インスタンス）単位で適用されるため、同一ノード上で稼働する複数のPodは同じSGの制約を受けます。Security Groups for Podsを使うと、Pod単位で個別のSGを割り当てられるようになります。

      [セキュリティグループを個別の Pod に割り当てる](https://docs.aws.amazon.com/ja_jp/eks/latest/userguide/security-groups-for-pods.html)

      ## Security Groups for Podsの概要

      ### 従来の課題
      - Kubernetesのデフォルトでは、NetworkPolicy等を設定しない限りすべてのPod間通信が許可される
      - SGはノード単位で適用されるため、Podごとの細かいアクセス制御ができない
      - NetworkPolicyでもPod間通信の制御は可能だが、対応したCNIプラグインの導入が別途必要になり、AWSのSGを使った既存の運用・監査プロセスとは別の仕組みを管理することになる

      ### Security Groups for Podsの利点
      - AWS Security Groupsの機能をそのままPodレベルで適用できるため、RDSなど他のAWSリソースと同じSGベースのアクセス制御に統一できる
      - IPアドレス、ポート、プロトコルレベルでの細かい制御が可能
      - AWS VPCネットワーキング（ENI）と直接統合されているため、既存のAWSのセキュリティ管理・監査プロセスをそのまま活用できる

      ### 注意
      - VPC CNIプラグインでの設定（後述）が必要です。
      - ENIトランキングに対応したEC2インスタンスタイプでのみ利用可能です。`t`ファミリーはENIトランキングに対応していないため利用できません
      - EKS Auto Modeでは、ノードのプロビジョニングやネットワーキング設定をAWS側が自動管理し、ユーザーがVPC CNIの設定を直接変更できないため、Security Groups for Podsはサポートされていません

      ## Security Groupsの適用方法

      - VPC CNI(aws-node)に`ENABLE_POD_ENI=true`の環境変数を設定します。これによりノードにトランクENIが追加され、ブランチENIを割り当てられるようになります。[Amazon EKS Pod のセキュリティグループ用に Amazon VPC CNI Plugin for Kubernetes を設定する](https://docs.aws.amazon.com/ja_jp/eks/latest/userguide/security-groups-pods-deployment.html)
      - Pod用にセキュリティグループを作成します。（通常のSGと同様、必要なIP/ポート/プロトコルのルールを定義します）
      - SecurityGroupPolicyリソースを作成し、`podSelector`や`serviceAccountSelector`で対象のPodを指定した上で、適用するセキュリティグループを指定します。
        - SecurityGroupPolicyは、Pod起動時にVPC Resource ControllerがブランチENIを割り当てるための設定情報です。そのため、SecurityGroupPolicyリソースとPodを同時に作成すると、SecurityGroupPolicyがまだクラスタに認識される前にPodがスケジューリングされてしまい、ブランチENIの割り当てに失敗してPod起動が失敗する可能性があります。その場合はSecurityGroupPolicy作成後にPodを再作成すれば起動できます。

      # プラクティス
      本プラクティスでは EKS Auto Mode を採用しているため、Security Groups for Podsは使用できません。上記の仕組みと制約を理解した上で、本issueをクローズしてください。

  - title: Kubernetes RBACによるアクセス制御
    body: |
      # Kubernetes RBACによるアクセス制御
      Kubernetes RBAC（Role-Based Access Control）は、クラスタ内のKubernetesリソースへの操作を、ユーザーやServiceAccountの役割（Role）に基づいて制御するセキュリティ機能です。「誰が」「どのリソースに対して」「どの操作を」実行できるかを明示的に定義し、必要最小限の権限のみを付与することで、設定ミスや権限の濫用によるセキュリティリスクを最小化できます。

      [Using RBAC Authorization](https://kubernetes.io/docs/reference/access-authn-authz/rbac/)

      ## RBACの概要

      ### RBACがない場合の課題
      - クラスタ内のユーザーやServiceAccountに対する権限の絞り込みが行われず、必要以上に強い権限を持ちやすい
      - CI/CDや運用ツール用のServiceAccountがクラスタ管理者相当の権限を持ってしまうケースがある
      - 誰がどのリソースを操作できるかが不透明になり、意図しない変更や事故の温床になる

      ### RBACによる制御の利点
      - ユーザー・ServiceAccountごとに必要最小限の権限を明示的に定義できる
      - Namespace単位・クラスタ単位で権限のスコープを分離できる
      - マニフェストとしてコード管理できるため、権限変更の履歴を追跡・レビューしやすい

      ## RBACの基本概念

      ### 主要なリソース
      - **Role** - 特定のNamespace内のリソースに対する権限を定義
      - **ClusterRole** - クラスタ全体（またはNamespaceに属さないリソースやNamespaceをまたぐリソース）に対する権限を定義
      - **RoleBinding** - RoleをユーザーやServiceAccountに紐付け、同一Namespace内で権限を有効化する
      - **ClusterRoleBinding** - ClusterRoleをユーザーやServiceAccountに紐付け、クラスタ全体で権限を有効化する

      なお、ClusterRoleをRoleBindingと組み合わせることで、クラスタ全体で使い回せる権限定義を特定のNamespaceのみに限定して適用することも可能です。

      ### APIGroups とリソースの指定

      RBACでは、対象となるKubernetesリソースをAPIGroupsとリソース名で指定します。主要なAPIGroupsは以下の通りです。

      - **""** (core group) - Pod、Service、ConfigMap、Secret など
      - **apps** - Deployment、DaemonSet、ReplicaSet など
      - **networking.k8s.io** - NetworkPolicy、Ingress など
      - **rbac.authorization.k8s.io** - Role、RoleBinding など
      - **apiextensions.k8s.io** - CustomResourceDefinition など

      利用可能なAPIGroupsとリソースは以下のコマンドで確認できます：
      ```bash
      # 全てのAPIリソースを表示
      kubectl api-resources
      ```

      ### ロールで設定する権限(verbs)の種類

      - **get** - 個別リソースの取得
      - **list** - リソースの一覧表示
      - **create** - リソースの作成
      - **update/patch** - リソースの更新（updateは全体の置き換え、patchは差分の適用）
      - **delete** - リソースの削除
      - **watch** - リソースの変更を監視（変更イベントをストリームで受信）

      ### ServiceAccountとは
      ServiceAccountとは、PodなどにKubernetes APIを操作するための身分（ID）を与える仕組みです。

      - Pod内のプロセスがKubernetes APIにアクセスする際に使用する、Kubernetesが管理するアカウント
      - IAMユーザーのような人間のユーザーとは異なり、Kubernetes自身が発行・管理する主体で、Pod起動時にトークンとしてマウントされる
      - 何も指定しなければ、PodはそのNamespaceの`default` ServiceAccountを自動的に使用する
      - RoleBinding/ClusterRoleBindingでServiceAccountに権限を紐付けることで、そのServiceAccountを使うPod（＝アプリケーション）が実行できるKubernetes API操作を制御できる

      ## セキュリティのベストプラクティス

      ### 最小権限の原則
      - 必要なAPIGroups・リソース・verbsのみを明示的に付与する
      - ワイルドカード（`*`）の使用を避け、権限の範囲を最小化する
      - `cluster-admin`のような強力な既定ClusterRoleの利用は避け、用途に合わせた専用のRole/ClusterRoleを作成する

      ### ServiceAccountの管理
      - Pod・CronJobなどワークロードの用途別にServiceAccountを作成し、権限を使い分ける
      - default ServiceAccountへの権限付与は避け、必要に応じて`automountServiceAccountToken: false`でトークンの自動マウントも無効化する
      - 不要になったServiceAccountおよびそれに紐づくRoleBinding/ClusterRoleBindingは削除する

      # プラクティス

      時間による計画的な性能拡張を想定したCronJobを作成する。

      - CronJobを作成する
        - コードはcodes/backend/k8sディレクトリに格納
        - 対象はbackend Deployment（frontendはHPAによるオートスケーリングが既に実装されており、CronJobでreplicasを直接patchしてもHPAに上書きされてしまうため対象外とする）
        - スケールアウト用のCronJob
          - 時間は任意（スケールイン用の少なくとも2分前にする）
          - イメージは`bitnami/kubectl:latest`を使う
          - `kubectl patch deploy backend -p '{"spec":{"replicas":2}}'`コマンドでバックエンドのPod数を増やす
          - 任意のServiceAccountを指定
        - スケールイン用のCronJob
          - 基本的にスケールアウト用と同じ。時間とスケール数を変える
        - CronJob用のRBAC
          - ServiceAccount
          - Role
            - apps.deploymentsを"get", "list", "patch"する権限を持つ
            - resourceNamesで対象をbackendのみに限定する（他のDeploymentをpatchできないようにする）
          - RoleBinding

  - title: ReadOnlyRootFilesystemによるセキュリティ強化
    body: |
      # ReadOnlyRootFilesystemによるセキュリティ強化
      ReadOnlyRootFilesystem設定は、コンテナのルートファイルシステムを読み取り専用にするセキュリティ機能です。この設定により、悪意のあるコードによるファイルシステムの改ざんやマルウェアの永続化を防止できます。

      [Configure a Security Context for a Pod or Container](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/)

      ## ReadOnlyRootFilesystemの概要

      ### なぜ必要か
      - コンテナのルートファイルシステムはデフォルトで書き込み可能なため、アプリケーションに脆弱性（RCE等）があると、攻撃者が任意のファイルを書き込み・改ざんできてしまう
      - 攻撃者はWebシェルの配置や既存バイナリの置き換え、cronの追加などにより、コンテナ内に永続的な足場を作ることができる
      - コンテナはroot（またはそれに近い権限）で実行されることが多く、書き込み制限がないとシステムファイルや設定ファイルまで自由に変更される恐れがある
      - アプリケーション自身の不具合で意図せず設定ファイルやライブラリを書き換えてしまう「事故」を防ぐ意味でも有効

      ### セキュリティ上の利点
      - ファイルシステムへの不正な書き込みを防止
      - マルウェアの永続化を阻止
      - 実行時のファイル改ざんを防止
      - アプリケーションの不正な設定変更を阻止

      ### 動作原理
      - コンテナのルートファイルシステム（/）を読み取り専用でマウント
      - コンテナのルートファイルシステムはイメージから生成される1つのマウント（overlayfs等）であるため、`/tmp`や`/var/tmp`などの一時ディレクトリも同じマウントに含まれ、特に区別なく読み取り専用になる
      - この制限はカーネルのマウントオプションによって強制されるため、コンテナ内でroot権限を奪われた場合でも回避できない（Defense in Depthの一環）
      - 書き込みが必要な場合は、別途ボリュームをマウントする必要がある

      ## 実装時の考慮点

      ### 一時ファイルの処理
      多くのアプリケーションは一時ファイルを作成する必要があります：
      - `/tmp` ディレクトリへの書き込み
      - ログファイルの出力
      - 設定ファイルの動的生成

      これらの書き込み先までルートファイルシステムと一緒に読み取り専用にしてしまうと、アプリケーションが起動・動作できなくなります。そのため事前にアプリケーションが実際にどこへ書き込むかを特定し、そのパスにだけ個別にボリュームを割り当てる、という対応が必要になります。

      ### 解決策
      書き込みが必要な場合は、以下のボリュームタイプを使用：
      - **emptyDir** - Pod内で共有する一時領域。ルートファイルシステムとは独立したマウントとして扱われるため、readOnlyRootFilesystemの制約を受けずに書き込み可能
      - **tmpfs** - メモリベースの一時ファイルシステム。ディスクI/Oが発生しない分高速だが、ノードのメモリを消費し、Pod終了時にデータは失われる
      - **PersistentVolume** - 永続化が必要なデータ

      # プラクティス
      - frontendとbackendにReadOnlyRootFilesystemを設定する
        - frontendは`/var/cache/nginx`と`/run`に書き込みが必要

  - title: 非rootユーザーでのPod実行によるセキュリティ強化
    body: |
      # Podを非rootユーザーで実行する
      Podを非rootユーザーで実行することは、コンテナセキュリティの基本的なベストプラクティスです。rootユーザーでの実行は、セキュリティ侵害時の影響範囲を拡大させるリスクがあるため、必要最小限の権限で実行することが重要です。

      [Configure a Security Context for a Pod or Container](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/)

      ## なぜrootユーザーでの実行がリスクになるのか

      コンテナはLinuxのNamespace機能によりホストとプロセス空間・ファイルシステムなどが分離されていますが、標準的な構成（User Namespaceを使わない場合）ではUID/GIDの名前空間はホストと共有されています。つまり、コンテナ内でroot（UID 0）として動いているプロセスは、ホストのカーネルから見ても「UID 0のプロセス」として扱われます。

      そのため、アプリケーションの脆弱性やコンテナランタイムの不備などによって「コンテナブレイクアウト」（コンテナの分離を突破してホスト側に影響を及ぼすこと）が発生した場合、コンテナ内でrootだった攻撃者はホスト上でもroot権限を持ってしまう可能性があります。非rootユーザーで実行しておけば、同じ脆弱性を突かれたとしても、攻撃者が得られる権限はホスト上の一般ユーザー相当に制限され、被害範囲を大きく縮小できます。

      ### デフォルト設定の問題点
      - 多くのコンテナイメージは、Dockerfileで明示的にユーザーを指定しない限りrootユーザー（UID 0）で実行される
      - rootユーザーはコンテナ内のあらゆるファイル・プロセスに対して強力な権限を持つため、アプリケーションに脆弱性があった際に攻撃者が行える操作の範囲が広い（任意ファイルの書き換え、他プロセスへのシグナル送信など）
      - セキュリティ侵害時の被害が拡大しやすい

      ### 非root実行によるセキュリティ上の利点
      - 権限昇格攻撃のリスクを軽減（allowPrivilegeEscalationの防止とも関連）
      - システムファイルへの不正アクセスを防止（一般ユーザー権限では変更できないファイルが多い）
      - コンテナブレイクアウト時の影響範囲を制限
      - 最小権限の原則に従った実行環境の実現

      ## 実装方法

      ### SecurityContextの設定
      PodまたはContainerレベルでSecurityContextを設定することで、イメージ側の実装（DockerfileのUSER命令の有無）に関わらず、クラスタ側のポリシーとして非root実行を強制・保証できます。

      - **runAsNonRoot** - `true`にすると、コンテナ起動前にkubeletが実行ユーザーのUIDを確認し、UID 0（root）で起動しようとした場合はコンテナの起動自体を失敗させる。あくまで「rootでの起動を拒否する」ためのガードであり、これ単体では非rootのユーザーを指定したことにはならない点に注意（runAsUserと併用するのが基本）
      - **runAsUser** - 実行するユーザーのUIDを指定する。イメージ内に対応するユーザー名が存在していなくても、UIDが指定できれば起動は可能（ただしアプリケーションがそのUIDで必要なファイル・ディレクトリにアクセスできる必要がある）
      - **runAsGroup** - 実行するプロセスの主グループGIDを指定する
      - **fsGroup** - マウントされたボリューム（emptyDirやPersistentVolumeなど）の所有グループを指定する。Kubernetesがボリュームのマウント時に指定したGIDへの書き込み権限を自動的に付与するため、非rootユーザーでもボリューム配下への書き込みが可能になる

      ## 実装時の考慮点

      - **ポート1024未満の使用** - Linuxではポート1024未満（well-known port）へのバインドに`CAP_NET_BIND_SERVICE`というLinux Capabilityが必要で、通常これはrootにのみ付与される。非rootユーザーで直接80番などにバインドしようとすると`Permission denied`になるため、アプリケーションは8080などの非特権ポートで待ち受け、Service側でポート変換（例: 80番で受けて8080番のPodへ転送）を行う
      - **ファイル権限** - イメージ内のファイル・ディレクトリの所有者がrootのままだと、非rootユーザーに切り替えた際にアクセスできず起動エラーになることがある。Dockerfileで事前に`chown`しておくか、fsGroupでボリューム側の権限を調整する
      - **イメージの変更** - 非rootユーザーが存在しないイメージの場合、Dockerfileで`RUN useradd`等によりユーザー・グループを作成し、`USER`命令で実行ユーザーを切り替える必要がある

      # プラクティス
      - frontendとbackendのPodを非root強制にし非rootで実行する
        - frontend
          - nginxイメージにはnginxユーザーおよびグループ(101:101)が既に存在します
          - Podの待ち受けポートを80から8080に変更する
            - nginx.confをconfigmapにして/etc/nginx/nginx.confにマウント
            - nginx.confに書かれたリッスンポートを80から8080に変更
            - その他、k8sマニフェストもポート変更（Serviceの公開ポートは80のままで良い）
        - backend
          - nodeイメージにはnodeユーザーおよびグループ(1000:1000)が既に存在します
        - IAMポリシー追加: ポート変更に伴い、EKS Auto ModeのロードバランサーがSecurity Group/タグを更新できずヘルスチェックが失敗する場合はポリシー追加する
          - `eks-cluster-role`に`ec2:DeleteTags`・`elasticloadbalancing:RemoveTags`を補うIAMポリシーを追加する

  - title: allowPrivilegeEscalationによる特権昇格の防止
    body: |
      # allowPrivilegeEscalationによる特権昇格の防止
      allowPrivilegeEscalation(権限昇格を許可する)設定は、コンテナ内のプロセスが実行時に、起動時点よりも多くの特権を取得することを防ぐセキュリティ機能です。この設定により、setuidバイナリやsudoコマンドを悪用した特権昇格攻撃を防止できます。

      [Configure a Security Context for a Pod or Container](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/)

      ## なぜ特権昇格の防止が必要か

      非rootユーザーでPodを実行していても、それだけでは特権昇格を防げません。コンテナイメージ内に`sudo`や`passwd`のようなsetuidビット付きバイナリが含まれていると、非rootユーザーであってもそのバイナリの実行時に一時的にroot権限を取得できてしまいます。攻撃者がコンテナに侵入した場合、こうした仕組みを悪用してroot権限を奪い、コンテナブレイクアウト（コンテナの隔離を破ってホストへ影響を及ぼすこと）を試みる可能性があります。allowPrivilegeEscalationは、非rootでの実行強制とセットで設定することで、この「起動時は非rootでも実行時にrootへ戻れてしまう」経路を塞ぐための設定です。

      ### 特権昇格の仕組み
      - 通常、Linuxのプロセスは実行したユーザーと同じ権限を引き継ぐ
      - しかし、setuidビットが付与されたバイナリを実行すると、実行したユーザーではなく**バイナリの所有者（多くはroot）の権限**でプロセスが動作する
      - sudoコマンドも同様に、設定に応じて実行ユーザーより高い権限を一時的に取得する仕組み
      - 攻撃者はコンテナに侵入した後、これらの仕組みを悪用して権限昇格を狙うことが多い

      ### セキュリティリスク
      - コンテナブレイクアウトのリスク増大
      - システム権限の不正取得
      - ホストシステムへの影響拡大
      - マルウェアによる権限昇格攻撃

      ## allowPrivilegeEscalationの動作原理

      ### allowPrivilegeEscalation: false (特権昇格を許可しない) 設定時の効果
      - setuidバイナリを実行しても実効ユーザーIDが変わらない
      - sudoコマンドを実行しても権限が昇格しない
      - プロセスは起動時の権限レベルを維持したまま動作する
      ### デフォルト値
      - allowPrivilegeEscalationの**デフォルト値はtrue**であり、未設定の場合は特権昇格が許可された状態になる

      ### 設定時の注意点
      - `runAsNonRoot`とは独立した設定であり、非rootユーザーでの実行を強制しても自動的にfalseにはならない。両方を明示的に設定する必要がある

      # プラクティス
      - frontendとbackendのSecurityContextに特権昇格防止の設定を追加する
        - `allowPrivilegeEscalation: false`を設定する
        - 設定後、Podが正常に起動し、アプリケーションが問題なく動作することを確認する

  - title: 特権のはく奪（Capability Drop）によるセキュリティ強化
    body: |
      # 特権のはく奪（Capability Drop）によるセキュリティ強化
      Linux Capabilitiesは、従来のroot権限を細分化し、プロセスに必要最小限の権限のみを付与する仕組みです。コンテナ実行時に不要な特権を削除（drop）することで、セキュリティリスクを大幅に軽減できます。

      [Configure a Security Context for a Pod or Container](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/)

      ## Linux Capabilitiesの概要

      ### 従来のroot権限の問題
      - root権限は「全てか無か」の権限モデル
      - 必要以上に強力な権限を付与してしまう
      - セキュリティ侵害時の影響が甚大（1つのプロセスが乗っ取られるとホスト全体に影響が及びうる）
      - 最小権限の原則に反する

      ### Capabilitiesによる権限の細分化
      - root権限を個別の機能単位（約40種類）に分割した仕組み
      - プロセスに必要な権限のみを付与できる
      - 不要な権限は削除（drop）して攻撃面を縮小
      - より細かなセキュリティ制御が可能

      ## 主要なLinux Capabilities

      なぜdropの対象を意識する必要があるか理解するため、代表的なCapabilityと悪用された場合のリスクを整理します。

      ### ネットワーク関連
      - **CAP_NET_BIND_SERVICE** - 1024未満のポートでのバインド。Webサーバーなど特権ポートを使うアプリケーションで必要になることがある
      - **CAP_NET_RAW** - RAWソケットの作成。攻撃者に付与されるとパケットの偽装（spoofing）やARPスプーフィングなどネットワーク詐称の踏み台にされうる
      - **CAP_NET_ADMIN** - ネットワーク設定の変更。ルーティングテーブルやファイアウォール設定を書き換えられるため、通信の傍受や迂回に悪用されうる

      ### ファイルシステム関連
      - **CAP_DAC_OVERRIDE** - ファイル権限（DAC: Discretionary Access Control）の無視。本来読み書きできないファイルにもアクセスできてしまうため、機密ファイルの窃取に直結する
      - **CAP_FOWNER** - ファイル所有者権限の無視。所有者チェックをすべて回避できるため、他プロセスが作成したファイルも自由に操作されうる
      - **CAP_CHOWN** - ファイル所有者の変更。権限昇格の踏み台（自分が所有者になれば他の権限チェックも回避しやすくなる）として使われうる

      ### システム管理関連
      - **CAP_SYS_ADMIN** - システム管理操作（非常に強力）。mountやカーネル機能へのアクセスなど広範な操作が可能で、事実上root権限に近く、コンテナブレイクアウトに直結しやすいため特に注意が必要
      - **CAP_SYS_TIME** - システム時刻の変更。ログのタイムスタンプ改ざんなど、侵害の痕跡を消す（証拠隠滅）目的で悪用されうる
      - **CAP_KILL** - 他プロセスへのシグナル送信。本来は自プロセスのみに制限されるべき操作で、他プロセスを強制終了させるDoS攻撃に使われうる

      ## containerdのデフォルトCapabilities

      EKS AutoMode では、containerd を使用してコンテナを実行します。containerd はLinuxの互換性維持のため、多くの一般的なコンテナワークロードで問題が起きないよう、デフォルトで以下のCapabilitiesを付与しています。つまり明示的に設定しない限り、実際に必要かどうかに関わらずこれらの権限がコンテナに渡っている状態になります。

      - CAP_CHOWN
      - CAP_DAC_OVERRIDE
      - CAP_FSETID
      - CAP_FOWNER
      - CAP_MKNOD
      - CAP_NET_RAW
      - CAP_SETGID
      - CAP_SETUID
      - CAP_SETFCAP
      - CAP_SETPCAP
      - CAP_NET_BIND_SERVICE
      - CAP_SYS_CHROOT
      - CAP_KILL
      - CAP_AUDIT_WRITE

      [containerd/pkg/oci/spec.go · containerd/containerd](https://github.com/containerd/containerd/blob/1117f663e77d662b02cec530a03310ed91b1d18b/pkg/oci/spec.go#L118)

      多くのアプリケーションはこれらの権限を実際には使わないため、デフォルトのままだと「使っていないのに攻撃者に使われうる」権限が残り続けることになります。

      ## 特権のはく奪戦略

      ### ALL権限の削除
      最も安全なアプローチは、すべての特権を削除することです。上記のようにアプリケーションが実際に必要とするCapabilitiesはごく一部であることが多いため、まず全てを削除してから必要な分だけ足す「default deny」の考え方が推奨されます：
      ```yaml
      securityContext:
        capabilities:
          drop:
            - ALL
      ```

      ### 必要に応じた権限の追加
      削除後、アプリケーションに必要な最小限の権限のみを追加します。「何が必要か分からないので広めに許可する」ではなく、「動作確認をして初めて必要なものだけを足す」順序にすることで、不要な権限の付与を防げます：
      ```yaml
      securityContext:
        capabilities:
          drop:
            - ALL
          add:
            - NET_BIND_SERVICE  # 必要な場合のみ
      ```

      # プラクティス
      - frontendとbackendのSecurityContextで特権をすべてはく奪する

  - title: Seccompプロファイルによるシステムコール制限
    body: |
      # Seccompの概要
      Seccomp（Secure Computing）は、コンテナが実行できるシステムコールを制限することで、攻撃面を大幅に削減するLinuxセキュリティ機能です。コンテナのランタイムセキュリティを向上させ、潜在的な脆弱性の悪用を防ぐことができます。

      # Seccompの必要性
      - **コンテナは、何も制限しなければ多くのシステムコールを利用できる**
        - Linuxには400種類近くのシステムコールがあります。
        - 一般的なアプリケーションが実際に利用するのは、その一部だけです。
        - しかし、コンテナでは何も設定しなければ、ホストと同じように多くのシステムコールを呼び出せます。
      - **不要なシステムコールを利用できると、攻撃の手段が増える**
        - アプリケーションに脆弱性がある場合、攻撃者に不要なシステムコールまで利用される可能性があります。
        - その結果、コンテナやホストへの攻撃につながるリスクが高まります。
      - **Seccompで、利用できるシステムコールを制限できる**
        - Seccompは、プロセスが利用できるシステムコールを制限する仕組みです。
        - アプリケーションに必要なシステムコールだけを許可することで、攻撃に悪用される可能性のあるシステムコールを減らせます。
        - そのため、脆弱性を悪用された場合でも、被害を抑えるための防御層として機能します。
      - **最小権限の原則に沿ったコンテナを実現できる**
        - Kubernetesでは、PodにSeccompプロファイルを指定しない場合、Seccompは`Unconfined`として動作します。
        - そのため、Seccompによるシステムコール制限を有効にするには、適切なプロファイルを設定する必要があります。

      # 解決策
      - デフォルトSeccompプロファイル（RuntimeDefault）の適用
        - コンテナランタイムが提供する安全なデフォルトプロファイルを使用
        - 一般的なワークロードに適した制限を自動的に適用でき、アプリケーションごとにプロファイルを作り込む必要がない
      - カスタムSeccompプロファイルの作成
        - アプリケーション固有の要件に合わせて許可するシステムコールを個別に定義
        - より厳格な制限やアプリケーション特有のシステムコールの許可が可能だが、対象アプリケーションが実際に使用するシステムコールを事前に洗い出す必要があり、作成・保守のコストが高い

      本プラクティスでは RuntimeDefault プロファイルを採用します。個々のアプリケーションが使用するシステムコールを分析しなくても、コンテナランタイムが提供する適切なデフォルト制限を簡単に適用でき、多くのワークロードで十分な効果が得られるためです。

      # Seccompの動作原理
      - システムコールがカーネル内部で実際に処理される前に傍受し、ポリシーで許可されたもののみを通す
      - 「危険なものだけを拒否する」ブロックリスト方式ではなく、「許可したものだけを実行させる」アローリスト方式であるため、想定していない未知の危険なシステムコールであっても、許可リストに含まれていなければ自動的に拒否される点でより安全
      - フィルタリングはBPF（Berkeley Packet Filter）としてカーネル内で処理されるため、Linuxカーネルの機能としてオーバーヘッドが非常に少ない
        - BPFは、カーネル内で小さなフィルタプログラムを安全かつ高速に実行できる仕組みです。
        - ユーザー空間との切り替え（コンテキストスイッチ）が発生せず、カーネル内で判定が完結するため、アプリケーションプロセス側での処理コストがほとんどかかりません。
      - コンテナランタイム（containerd/Docker）がデフォルトプロファイルを提供しており、利用者が自前でアローリストを用意しなくても最低限の制限を適用できる

      ## RuntimeDefaultプロファイル
      - コンテナランタイムが提供するデフォルトのSeccompプロファイル
      - 一般的なアプリケーションに必要なシステムコールのみを許可し、`reboot`、`mount`、`kexec_load`、`add_key`といった危険なシステムコールをブロックする
      - 設定が簡単で多くのワークロードで利用可能
      - EKS Automodeのノードはcontainerdを使用しているため、デフォルトのSeccompプロファイルは次の内容 [seccomp_default.go](https://github.com/containerd/containerd/blob/main/contrib/seccomp/seccomp_default.go)

      ## Kubernetesでの設定方法
      PodレベルまたはコンテナレベルのSecurityContextで以下のように設定：
      ```yaml
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      ```

      Podレベルとコンテナレベルの両方を設定した場合、コンテナレベルの設定が優先されます。

      # プラクティス
      - frontendとbackendのPodにSeccompプロファイルを設定する
        - SecurityContextに `seccompProfile: type: RuntimeDefault` を追加
        - 設定後、Podが正常に起動し動作することを確認する

      ## 更に発展的なプラクティス
      このプラクティスは余裕がなければやらなくてもいいです。

      - カスタムSeccompプロファイルの作成と適用
        - Security Profiles Operatorを使用してアプリケーション固有のプロファイルを生成
        - 生成されたプロファイルをPodに適用し、より厳格な制限を実現

  - title: SELinuxによるファイルアクセスの制限
    body: |
      **本issueは内容を確認するだけでクローズしてください。**

      # SELinuxによるアクセス制御の概要
      SELinux（Security-Enhanced Linux）は、Linuxカーネルに組み込まれたセキュリティモジュールです。ユーザーやプロセスがアクセスできるファイルなどのリソースをポリシーベースで制限し、コンテナやホストが侵害された際の被害範囲を最小化します。

      ## なぜSELinuxが必要か

      Kubernetesのコンテナはホストとカーネルを共有しているため、コンテナ内で脆弱性が悪用されると、コンテナエスケープによりホスト上の他のリソースへアクセスされるリスクがあります。SELinuxを使うと、コンテナごとに一意なセキュリティコンテキスト（ラベル）を割り当てられるため、コンテナエスケープが発生した場合でも、そのコンテナに許可された範囲を超えたファイルへはアクセスできず、被害を限定できます。

      ## SELinuxの概要

      従来のアクセス制御（DAC: Discretionary Access Control）は、ファイルやディレクトリに設定したパーミッションに基づく制限です。しかしDACでは、ファイルの所有者であるユーザー自身が裁量でアクセス権を変更できてしまい、かつrootユーザーはパーミッションに関わらず全てのリソースにアクセスできるため、rootユーザーが乗っ取られると際限なく被害が広がってしまうという弱点があります。

      SELinuxは強制アクセス制御（MAC: Mandatory Access Control）を提供し、ユーザーの裁量に関わらずポリシーで明示的に許可されたアクセスのみを許可することで、システム全体のセキュリティを強化します。プロセスやファイルにはそれぞれセキュリティコンテキストが付与され、あるプロセスが特定のファイルにアクセスできるかは、両者のコンテキストの組み合わせがポリシーで許可されているかどうかで判定されます。rootユーザーもこのポリシーに従う必要があるため、DACだけでは防げない権限昇格やコンテナエスケープ後の被害を抑えることができます。

      ## SELinuxの動作モード

      ### Enforcing（強制モード）
      - SELinuxポリシーを強制的に適用
      - ポリシー違反をブロックし、ログに記録
      - 本番環境で推奨されるモード

      ### Permissive（許可モード）
      - ポリシー違反をログに記録するが、ブロックしない
      - ポリシーのテストや調整に使用
      - 移行期間やトラブルシューティングに適している

      ### Disabled（無効モード）
      - SELinuxが完全に無効
      - 従来のDACのみが適用される

      ## Kubernetesクラスタでの活用

      - ワーカーノード
        - EKS Automode のワーカーノードはデフォルトでSELinuxがEnforcingモードで有効 [EKS Auto Mode を使用してクラスターインフラストラクチャを自動化する - Amazon EKS](https://docs.aws.amazon.com/ja_jp/eks/latest/userguide/automode.html)
      - Pod
        - ノードでSELinuxが有効な場合、コンテナランタイムによってPodごとに一意なセキュリティコンテキストが自動的に割り振られ、コンテナ内のファイルのみアクセスできるように制限される。 [Kubernetes API Reference Docs](https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.33/#securitycontext-v1-core)
          - これにより、同一ノード上で複数のコンテナが稼働していても、あるコンテナが乗っ取られた場合に他のコンテナが利用しているファイルへはアクセスできないよう分離される
          - 複数のPod間でファイルを共有したい場合など、PodのSecurityContextでSELinuxオプションを明示的に指定してラベルを揃えることも可能。
        - EKS Automode (Bottlerocket)ではすべての非特権Podに`container_t`タイプのラベルが自動的に付与されコンテナ実行ユーザーがrootでもアクションが制限される[Bottlerocket のセキュリティ機能 〜オープンソースの Linux ベースオペレーティングシステム〜 | Amazon Web Services ブログ](https://aws.amazon.com/jp/blogs/news/security-features-of-bottlerocket-an-open-source-linux-based-operating-system/)
          - コンテナ内でrootとして実行されるプロセスは、通常であればホスト側でも高い権限を持ち得ますが、SELinuxのラベルによって権限が`container_t`ドメインの範囲に閉じ込められるため、コンテナ内でroot権限が悪用されてもホスト全体への影響を防ぐことができる

  - title: 信頼できるベースイメージの選定
    body: |
      # 信頼できるベースイメージの選定の重要性
      コンテナイメージのベースイメージ選定は、セキュリティと運用性の両面で重要な判断です。ベースイメージにはOSやランタイムに加え、シェルやパッケージマネージャ、各種ライブラリなど数百〜数千のファイルが含まれており、これらすべてが自分のアプリケーションの脆弱性スキャン結果や攻撃対象領域（アタックサーフェス）に積み重なります。つまりベースイメージの選定を誤ると、アプリケーションコード自体に問題がなくても、イメージ全体としては脆弱な状態になってしまいます。さらに、そのイメージ自体が信頼できない提供元から取得されたものであれば、内容が改ざんされていたり悪意のあるコードが埋め込まれていたりするリスクも排除できません。適切なベースイメージと提供元を選ぶことで、脆弱性やサプライチェーンのリスクを最小化し、安全なコンテナ環境を構築できます。

      ## コンテナイメージのセキュリティリスク

      - 攻撃者が悪意のあるコンテナイメージをクラスタで実行する
      - 開発目的等で意図せず脆弱なイメージを使用してしまう

      ## ベースイメージ選定における考慮事項

      ### セキュリティ観点
      - **攻撃面の最小化** - 不要なパッケージやサービスが含まれていないイメージを選択する。含まれるパッケージが多いほど既知の脆弱性（CVE）を持つ可能性が高まり、また攻撃者がコンテナに侵入した際に悪用できるツール（bash、curl、パッケージマネージャ等）も増えてしまうため
      - **脆弱性の少なさ** - 定期的にセキュリティパッチが適用されているイメージを選ぶ。パッチが滞っているイメージはCVEが公開されてから修正されるまでの期間（脆弱性ウィンドウ）が長く、攻撃者に悪用される時間を与えてしまう
      - **セキュリティサポート期間** - 長期間サポートが提供されるイメージ（例：DebianのLTSやUbuntuのLTS）を選ぶ。サポート終了（EOL）したイメージはセキュリティパッチが提供されなくなり、既知の脆弱性が修正されないまま放置されるリスクがある
      - **信頼できる提供元** - 公式または検証済みのイメージ提供者を利用する。個人が公開している出自不明なイメージは、ビルド過程が不透明でマルウェアが混入していたり、意図的に悪意あるコードが埋め込まれているリスクを排除できないため

      ### 運用観点
      - **イメージサイズ** - 小さなイメージほどダウンロード時間や攻撃面が小さい。イメージサイズが小さいほどPull時間やデプロイ時間が短縮され、CI/CDのフィードバックループが速くなる。さらに前述の通り含まれるパッケージ数と攻撃面は比例するため、サイズの小さいイメージはセキュリティ面でも有利になりやすい
      - **アップデート頻度** - 定期的に更新されているかを確認する。メンテナンスが止まっているイメージはセキュリティ観点の「脆弱性の少なさ」にも直結する
      - **コミュニティサポート** - 十分なユーザーコミュニティとドキュメントがあるか。問題発生時に情報が得やすく、トラブルシューティングのコストを下げられる

      ## 信頼できるイメージ提供元

      ### 公式イメージの使用
      - **Docker Hub公式イメージ** - Dockerが維持管理する認証済みイメージ
      - **ディストリビューション公式** - Ubuntu、Alpine、CentOS等の公式イメージ
      - **ソフトウェアベンダー公式** - nginx、node、redis等の公式イメージ

      これらは提供元・ビルドプロセスが公開・監査されているため、出自不明なイメージと比べてマルウェア混入や意図的な悪意あるコードの混入といったサプライチェーンリスクを大きく下げられます。

      ### 検証済みレジストリ
      - **AWS ECR Public Gallery** - AWSが管理する公開レジストリ
      - **Google Container Registry** - Googleが提供するイメージ
      - **Red Hat Container Catalog** - Red Hatの認証済みイメージ
      - 自身で管理しているプライベートなレジストリ

      ### 提供元を制限する対策
      - kyverno等のポリシーエンジンをK8sに導入し、信頼できるレジストリからのイメージのみ実行を許可する (kyvernoの導入は別のissueで行います)

      ## 主要なベースイメージの比較

      - **Alpine Linux** - 軽量・セキュリティ重視。標準Cライブラリに`musl`を採用し必要最小限のパッケージ構成のため数MB程度と非常に小さいが、多くのLinuxディストリビューションが採用する`glibc`とは互換性がなく、`glibc`依存のバイナリ（Node.jsのネイティブモジュール等）で動作しないことがあるため注意が必要
      - **Ubuntu** - 互換性・パッケージが豊富。`apt`で幅広いソフトウェアを簡単に導入できる反面、パッケージ数が多い分イメージサイズは大きくなりやすい
      - **Debian** - 安定性・セキュリティ重視。リリースサイクルが緩やかで枯れたバージョンを使うため安定するが、その分最新パッケージの導入は遅くなる
      - **Red Hat UBI** - エンタープライズ向けで商用サポートありだが、利用範囲や再配布条件に制約があるため利用前にライセンスの確認が必要
      - **Distroless** - シェルやパッケージマネージャすら含まないため攻撃面を最小化できるが、コンテナ内にデバッグ用のコマンドが一切ないため、トラブルシュート時は`kubectl debug`のようなエフェメラルコンテナを使う工夫が必要になる

      ## Docker Hardened Image（DHI）

      Docker社が提供する、最小限かつ継続的にパッチが適用されるハードニング済みの公式イメージ群です。従来「Alpineやdistrolessを自分で選んでハードニングする」という作業を、Docker社側で完了させた形で提供するサービスと言えます。

      - **極小の攻撃面** - シェルやパッケージマネージャを含まない、あるいは必要最小限のパッケージのみで構成され、CVEの発生数を大幅に削減
      - **継続的なパッチ適用** - 脆弱性が公開されてから修正パッケージが提供されるまでの期間（脆弱性ウィンドウ）を短く保つ運用がされている
      - **署名とSBOMの提供** - イメージの出自を検証できる署名や、含まれるソフトウェア部品を記載したSBOMが標準で付属し、サプライチェーンの透明性を確保

      「信頼できる提供元」と「攻撃面が最小化されたベースイメージ」という、本issueで説明した2つの観点を両方満たす選択肢の一つとして参考にしてください。

      参考: [Docker Hardened Imageについて](https://qiita.com/skwt20/items/67ea055c8a58b6ad17f1)

      ## タグの違い

      DockerHubでイメージを検索すると同じイメージでも複数のタグが存在します。タグはイメージのバージョンや特性を示します。

      - **latest** - 最新版を指すタグだが、指す先のイメージ内容が時間の経過とともに変わってしまう（ビルドごとに異なるバージョンになる）ため、いつビルドしたかによって挙動が変わる再現性のない状態になりやすく、使用は推奨されない
      - **バージョン指定** - 具体的なバージョンを指定することで、いつ・誰がビルドしても同じ内容のイメージを再現できる。安定性と予測可能性を確保でき、問題発生時にどのバージョンが原因かも追跡しやすい
      - **軽量版** - `-slim`や`-alpine`などのタグは、不要なパッケージを省いた軽量イメージ。ドキュメントやマニュアル、コンパイラなど実行時に不要なファイルを除いているため、通常版よりイメージサイズと攻撃面の両方を削減できる

      ## ベストプラクティス

      ### イメージ選定指針
      - **公式イメージを優先** - Docker Hub公式やソフトウェアベンダー公式のイメージは、ビルドプロセスが管理・監査されており、マルウェア混入などのサプライチェーンリスクが低い
      - **定期的な更新** - 頻繁にメンテナンスが行われ、最新のセキュリティパッチが適用されたイメージを使用する
      - **タグの明示** - `latest`タグではなく具体的なバージョンを指定し、意図しないアップデートによる非互換や不具合の混入を防ぐ
      - **軽量版の検討** - 互換性問題がない場合はAlpineやslimを選択し、サイズと攻撃面を削減する

      ### 継続的な見直し
      - 定期的な脆弱性スキャンの実施 - ベースイメージ選定時だけでなく、運用中も新たなCVEが日々発見されるため継続的な確認が必要
      - ベースイメージのセキュリティアップデート追跡 - 使用しているバージョンのEOLやパッチ提供状況を把握し、計画的にアップデートする
      - イメージサイズとセキュリティのバランス評価 - 軽量化を追求しすぎて互換性トラブルやデバッグ困難に陥らないよう、要件に応じたトレードオフを検討する

      # プラクティス
      - Backendのベースイメージを軽量版のイメージに変える
        - DockerHubでnodeのイメージを検索し、さらにタグを`18`で絞る
        - 18系で軽量なイメージを選定しDockerfileを更新する
        - アプリケーションも更新したことが分かる用にindex.jsの表示文字列を更新する

  - title: イメージスキャンによる脆弱性検査
    body: |
      コンテナイメージのスキャンを行うことでコンテナイメージに含まれる既知の脆弱性を検出できます。

      ## イメージスキャンの必要性

      - コンテナイメージはOS標準パッケージやアプリケーションのライブラリなど、多くの依存関係を含んでおり、それらに既知の脆弱性（CVE）が発見されることがある
        - ビルド時点では安全だったイメージでも、後から新たな脆弱性が公開されることがあるため、時間の経過とともにリスクは変化する
      - 脆弱性のあるイメージを本番環境で使用すると、その脆弱性を悪用した攻撃を受けるリスクが高まる
        - コンテナは同じイメージを複数のPodで使い回すことが多く、1つの脆弱なイメージが多数の実行環境に影響を及ぼしうる
      - 定期的なスキャンにより、新たな脆弱性を早期に検出し、対応することが重要
        - CVE情報は日々更新されるため、ビルド時に一度スキャンして安全だと確認しても、継続的なスキャンが必要になる

      ## イメージスキャンの方法

      イメージスキャンには大きく2つのアプローチがあります。

      - レジストリの機能 (ECR、Docker Hub等) を使用して自動スキャン
        - イメージをプッシュするだけでスキャンが実行されるため、運用の手間が少ない
      - スキャンツール（Trivy等）を使用して手動スキャン（CIに組み込んで自動化することが多い）
        - デプロイ前のCIパイプラインに組み込むことで、脆弱性のあるイメージがレジストリに登録される前段階で検出できる

      本プラクティスでは、まずECRのイメージスキャン機能を使用します。

      ## ECRイメージスキャンの概要

      - [基本スキャン（Basic Scan）](https://docs.aws.amazon.com/ja_jp/AmazonECR/latest/userguide/image-scanning-basic.html)
      - [拡張スキャン（Enhanced Scan）](https://docs.aws.amazon.com/ja_jp/AmazonECR/latest/userguide/image-scanning-enhanced.html)

      ### 基本スキャン

      無料で使える。AWSネイティブのスキャン(推奨)と Clair 使用したスキャン(非推奨)がある。OSパッケージのみが検査対象で、npmやpipなど言語のパッケージマネージャーが管理するアプリケーション依存関係は対象外。プッシュ時またはオンデマンドでスキャン可能。

      ### 拡張スキャン

      有償。Amazon Inspector を使用した高度な脆弱性検査。OSパッケージに加え、アプリケーションパッケージ（npm、pip等の依存関係）も検査可能なため、基本スキャンより広い範囲をカバーできる。イメージプッシュ時のスキャンに加え、脆弱性DBが更新されるたびに過去にプッシュした既存イメージも再評価する自動連続スキャンに対応しており、プッシュ後に新たに公開された脆弱性も継続的に検出できる。

      ## 脆弱性の分類

      ECRイメージスキャンでは、検出された脆弱性を以下の重要度で分類します。重要度を分けることで、数多く検出される脆弱性の中から対応の優先順位を判断しやすくなります。

      ### 重要度レベル
      - **CRITICAL** - 緊急対応が必要な重大な脆弱性
      - **HIGH** - 高優先度で対応すべき脆弱性
      - **MEDIUM** - 中程度の脆弱性
      - **LOW** - 軽微な脆弱性
      - **INFORMATIONAL** - 情報提供レベル

      ## 脆弱性発見時の対応

      - ベースイメージやパッケージを最新版に更新してイメージを再ビルドする
        - パッチが提供されているパッケージであれば、バージョンを上げるだけで修正できることが多い
        - 脆弱性の数が多い場合や、ベースイメージ自体のサポートが終了している場合は、ベースイメージの変更を検討する
      - 修正後は再スキャンで脆弱性が解消されたことを確認してからデプロイする
        - 確認を省略すると、修正漏れや修正時に混入した別の脆弱性に気づかずデプロイしてしまうリスクがある

      # プラクティス
      - ECRレポジトリに基本イメージスキャンを設定する
        - ECRモジュールを拡張し、プッシュ時に基本スキャン（Basic Scan）を実行するよう設定する
        - backendまたはfrontendのイメージをビルドしてECRにプッシュする。プッシュ時にスキャンが実行され、検出された脆弱性と重要度の内訳を確認する

  - title: マルチステージビルドによるイメージサイズとセキュリティの最適化
    body: |
      **本issueは内容を確認するだけでクローズしてください。**

      マルチステージビルドは、1つのDockerfile内に複数の`FROM`命令（ビルドステージ）を記述し、最終的なコンテナイメージにはランタイムに必要な成果物だけを含める仕組みです。ビルドに使ったコンパイラやパッケージマネージャ、ソースコードなどを最終イメージから除外できるため、イメージサイズの縮小とセキュリティリスクの軽減を同時に実現できます。

      [Use multi-stage builds](https://docs.docker.com/build/building/multi-stage/)

      ## なぜマルチステージビルドが必要か

      マルチステージビルドを使わず単一ステージでビルドした場合、以下のような問題が発生します。

      - **攻撃面の拡大** - `npm install`やコンパイラなどのビルドツールがイメージに残ると、それらに含まれる脆弱性も一緒に本番環境へ持ち込まれる
      - **イメージサイズの肥大化** - devDependenciesやビルド時のキャッシュがそのまま含まれ、イメージの転送・デプロイに時間がかかる
      - **ソースコード漏洩のリスク** - ビルド前のソースコードや設定ファイルがイメージ内に残り、イメージを取得されると中身を読み取られてしまう

      マルチステージビルドは、「ビルドに必要な環境」と「実行に必要な環境」を1つのDockerfile内で明確に分離し、ビルドステージの成果物だけを後続のステージへ引き渡すことでこれらの問題を解決します。

      ## マルチステージビルドの概要

      ### マルチステージビルドの利点
      - **イメージサイズの削減** - 必要なファイルのみを最終イメージに含めるため、不要なレイヤーが残らない
      - **セキュリティリスクの軽減** - ビルドツールや開発用パッケージを除外することで、脆弱性の対象となるパッケージ数そのものを減らせる
      - **実行環境の最適化** - ビルドステージとは別に、軽量なベースイメージ（例: `alpine`）でランタイム環境を構築できる
      - **ビルドキャッシュの効率化** - ステージごとにレイヤーがキャッシュされるため、ソースコードのみを変更した場合は依存関係インストールのステージを再利用できる

      ## マルチステージビルドの基本構造

      実はfrontendのDockerfileはすでにマルチステージビルドを使用しています。以下のように、ビルドステージとランタイムステージを分けています。

      **ビルドステージ（Build Stage）**
      ```dockerfile
      FROM node:18 as build
      WORKDIR /app
      COPY package*.json ./
      RUN npm install
      COPY . .
      RUN npm run build
      ```

      **ランタイムステージ（Runtime Stage）**
      ```dockerfile
      FROM nginx:alpine
      COPY --from=build /app/build /usr/share/nginx/html
      ```

      `FROM`命令が実行されるたびに、それまでのステージとは独立した新しいファイルシステムのステージが開始されます。`as build`で名前を付けたビルドステージに対し、後続のステージから`COPY --from=build <ステージ内のパス> <コピー先>`と指定することで、buildステージ内で生成されたファイルだけを取り出してコピーできます。buildステージで使った`node`イメージ本体や、インストールした依存関係、ソースコードは最終的なランタイムステージには一切引き継がれません。

      ビルドステージでビルドした成果物が`/app/build`に格納され、ランタイムステージで`/usr/share/nginx/html`配下にコピーしています。これにより、最終イメージには`node`本体やnpmパッケージ、ソースコードが含まれず、`nginx:alpine`ベースの軽量なイメージのみが生成されます。

      ### 参考: backendとの違い

      一方でbackendのDockerfileは、`node:18.20.8-slim`イメージ上でそのまま`npm install --production`を実行する単一ステージ構成です。Node.jsのアプリケーションは実行時にもNode.jsランタイム自体を必要とするため、ビルドステージを分けても最終的に`node`ベースイメージそのものは残ります。そのためbackendでは、`--production`オプションでdevDependenciesを含めないことと、軽量な`slim`タグのベースイメージを使うことでイメージサイズを抑えています。マルチステージビルドが特に効果を発揮するのは、今回のfrontendのように「ビルド結果（静的ファイルなど）が、ビルド環境とは異なる軽量なランタイム（nginx）で動かせる」ケースです。

  - title: ECRレポジトリのアクセス制限とセキュリティ設定
    body: |
      # ECRレポジトリのアクセス制限設定の重要性
      Amazon ECR（Elastic Container Registry）のアクセス制限を適切に設定することで、コンテナイメージへの不正アクセスを防止し、セキュリティを向上させることができます。

      [Amazon ECR でのリポジトリポリシーの例](https://docs.aws.amazon.com/ja_jp/AmazonECR/latest/userguide/repository-policy-examples.html)

      ## ECRのセキュリティの重要性
      - コンテナイメージはOS・ライブラリ・実行コードまでを含む「アプリケーションの実行環境そのもの」であり、漏洩・改ざんの影響が大きい
      - リポジトリへのアクセスを誰でも行える状態にしておくと、次のようなリスクが発生する
        - 第三者が不正なイメージをプッシュし、それを知らずにデプロイしてしまうことでマルウェアの実行やバックドアの設置につながる
        - リポジトリ内のイメージを第三者が自由にプルできると、イメージに含まれる機密情報（認証情報や内部実装など）が漏洩する
      - こうしたリスクを避けるため、「誰が」「何を（push/pull）」できるかをリポジトリポリシーで明示的に制御し、必要最小限の権限のみを許可する（最小権限の原則）ことが重要

      ## ECRアクセス制限の概要

      ECRでは、IAMポリシーに加えて、ECRリポジトリ単位のリポジトリポリシーを設定できます。リポジトリポリシーでは、どのAWSアカウントやIAMエンティティに、どの操作を許可するかを制御します。

      ### リポジトリポリシーによる制御
      - **特定のIAMユーザー/ロールのみアクセス許可**
      - **特定のAWSアカウントからのアクセス制御**
      - **読み取り専用/読み書き権限の分離**
      - **IPアドレスベースのアクセス制限**

      # プラクティス
      - ECRリポジトリのアクセス制限を設定する
        - ECRモジュールを拡張してリポジトリポリシーを設定
          - CI/CD用のIAMロールにプッシュ権限を付与
          - EKSワーカーノードのIAMロールにプル権限のみ付与
          - 他のAWSアカウントからのアクセスを拒否

  - title: SOPSを使ったK8s Secretの暗号化
    body: |
      SOPS（Secrets OPerationS）は、機密情報を暗号化してGitリポジトリに安全に保存するためのツールです。KubernetesのSecretリソースを暗号化して管理することで、設定ファイルの機密性を保ちながらInfrastructure as Codeの運用を実現できます。

      [mozilla/sops: Simple and flexible tool for managing secrets](https://github.com/mozilla/sops)

      ## K8s Secret管理の課題
      - **SecretはデフォルトではBase64エンコードのみで暗号化されていない** - Base64は誰でもデコードできるため、Secretマニフェストをそのまま保存・共有するのは平文を保存するのとほぼ同じ
      - **Secretをプレーンテキストで保存するセキュリティリスク** - 上記の理由から、マニフェストをそのままGitにコミットすると、リポジトリにアクセスできる全員（リポジトリが漏洩・公開されれば全世界）に機密情報が渡ってしまう
      - **設定の共有とバージョン管理の困難さ** - IaCの原則ではマニフェストをGitで管理・レビューしたいが、Secretだけは別経路（手動適用など）で扱うことになり、他のK8sリソースと運用フローが分断される
      - **GitリポジトリにSecretをコミットできない問題** - 結果としてSecretだけ`.gitignore`で除外したり手動配布する運用になりがちで、変更履歴やレビューの対象から漏れてしまう

      これらの課題の根本は「Secretリソース自体には暗号化機能がない」という点にあります。そのため、Secretの値をGitにコミットする前段階で暗号化し、クラスタに適用する直前に復号する仕組みが必要になります。

      ## 課題の解決策
      - External Secret: AWS Secrets Managerなどの外部ストアにある機密情報を、クラスター内のネイティブなKubernetes Secretリソースへと同期し続けるオペレーター
      - Sealed Secrets: 公開鍵を使って誰でも安全に暗号化できるSealedSecretリソースをGitに保存し、クラスター内のコントローラーだけが持つ秘密鍵で復号するツール
      - vals: 設定ファイル内にref://形式で記述された機密情報の参照を、デプロイ実行時にVaultやAWSなど多様なバックエンドから取得して解決（置換）するCLIツール
      - SOPS: YAMLやJSONファイル内の機密情報（バリュー）をKMSやPGPキーで直接暗号化し、ファイル全体を安全にGit管理するためのCLIツール

      本プラクティスではSOPSを採用します。External SecretやSealed Secretsはクラスタ内にコントローラーを常駐させる必要がありますが、SOPSはコマンドラインで暗号化・復号するだけで導入でき、Terraformにおける機密情報の管理でも同じKMSキーとワークフローを使い回せるため、学習コストと運用ツールを一本化できるからです。

      ## SOPSの概要
      - **SOPS**はYAML/JSONファイルの値を暗号化するCLIツール
      - **KMSやPGPキー**を使用して暗号化
      - YAML/JSONの値のみを暗号化し、キー名を含む構造は平文のまま保持する。これにより暗号化後もGitのdiffでどの項目が変更されたかを追跡でき、通常のマニフェストと同じようにレビューできる
      - **暗号化されたファイルをGitで管理** - 機密情報を安全にバージョン管理

      ## SOPSによる暗号化手順
      - (事前準備) KMS等の暗号化キーを用意
      - SOPSコマンドを使用してSecretマニフェストを暗号化
      - デプロイ時にSOPSコマンドで復号化してKubernetesに適用

      復号には暗号化に使ったKMSキーへのアクセス権限が必要です。つまり暗号化ファイル自体はGitに置いても安全ですが、実質的な機密性はKMSキーへのIAM権限管理に依存することになります。KMSキーへのアクセスを絞らなければSOPSで暗号化する意味が薄れるため、後述のIAM制限が重要になります。

      ## SOPSのKubernetes統合
      - CLIツールで毎回手動で暗号化・復号化するのは面倒
      - KustomizeやHelmと組み合わせて使用可能
        - Kustomize: [ksops](https://github.com/viaduct-ai/kustomize-sops)
        - Helm: [helm-secrets](https://github.com/jkroepke/helm-secrets)
      - ArgoCDにもksopsを統合することが可能だが拡張が必要
        - [Argo CD Integration](https://github.com/viaduct-ai/kustomize-sops?tab=readme-ov-file#argo-cd-integration-)

      本プラクティスでは手動でのSOPSコマンド実行までを扱います。KustomizeやArgoCDとの統合は別プラクティス「ArgoCDにKSOPSを組み込む」で行います。

      # プラクティス
      - SOPS用のKMSキーを作成（別issue、Terraformにおける機密情報の管理で作成済なら不要）
        - KMSのTerraformコードは`codes/sops/terraform`に配置
        - KMSキーにアクセスできるIAMユーザーを制限する
          - KMSキーを復号できる＝機密情報を読めることと同義なので、必要最小限のユーザー・ロールのみに絞る
        - プロジェクトのrootに`.sops.yaml`を作成し、作成したKMSキーで暗号化する設定をする
          - `.sops.yaml`はファイルパスのパターンごとに使用する鍵を指定する設定ファイル。ルートに置くことで、配下のどのディレクトリからSOPSコマンドを実行しても同じ鍵設定が適用される
      - SOPSを使用したSecret暗号化の実装
        - 適当なKey/ValueをもったSecretのマニフェストを作成
        - SOPSを使用してSecretマニフェストを暗号化（デプロイはしなくていいです）
        - 暗号化後のファイルを確認し、キー名は平文のまま値だけが暗号化されていることを確認する

  - title: ArgoCDにKSOPSを組み込む
    body: |
      ArgoCDにKSOPS（Kustomize SOPS）を組み込むことで、SOPS暗号化されたKubernetesのSecretリソースを安全にGitOpsワークフローで管理できます。暗号化された機密情報をGitリポジトリに保存しながら、ArgoCDが自動的に復号化してクラスタにデプロイできるようになります。

      # 課題や必要性
      - GitOpsワークフローでSecretを管理する際の機密性確保
      - 暗号化されたSecretの自動復号化とデプロイ
      - 開発・ステージング・本番環境での一貫したSecret管理
      - CI/CDパイプラインでの手動復号化作業の削減

      # 解決策
      - KSOPS統合によるSOPS暗号化Secretの自動復号化
        - ArgoCDのrepo-serverにKSOPSプラグインを組み込む
        - SOPS暗号化されたYAMLファイルの透過的な復号化
        - Kustomizeとの統合による柔軟な設定管理
      - External Secrets Operatorによる外部シークレット管理
      - Sealed Secretsによる暗号化Secret管理

      本プラクティスではKSOPSを採用します。既存のSOPSワークフローを活用しつつ、ArgoCDとの統合により完全に自動化されたGitOpsワークフローを実現できるためです。

      # 解決策の説明
      KSOPSはKustomizeの機能を拡張するプラグインで、SOPS暗号化されたファイルを透過的に復号化します。

      ## KSOPS の動作原理
      - **Kustomize統合** - KustomizeのGenerator機能を使用してSOPS復号化を実行
      - **透過的復号化** - ビルド時にSOPS暗号化ファイルを自動復号化
      - **KMS統合** - AWS KMSキーを使用した暗号化・復号化
      - **権限管理** - ArgoCDのサービスアカウントにKMSアクセス権限を付与

      実装手順：
      - SOPS暗号化されたSecretファイルをGitリポジトリに保存
      - KustomizationでsecretGeneratorとしてKSOPSを設定
      - ArgoCDのrepo-serverをKSOPS対応版にアップグレード
      - Pod IdentityでArgoCDサービスアカウントにKMS権限を付与

      # プラクティス
      
      - KSOPSをArgoCDに組み込む
        - KSOPSに対応したArgoCDの設定
          - [公式リポジトリ](https://github.com/viaduct-ai/kustomize-sops)を参考にArgoCDのrepo-serverをKSOPS対応版にアップグレード
            - KSOPSだけでなくSOPSもインストールする
            - ArgoCDのConfigmapを修正しKustomizeプライグインを有効化する
        - Pod IdentityでArgoCDのrepo-serverにKMS権限を付与
          - SAは`argocd-repo-server`
          - 権限は`kms:DescribeKey`と`kms:Decrypt`が最低限ついていればいい
        - KMSキーのリソースベースポリシーでArgoCDのrepo-serverからの操作を許可する
        - SOPS暗号化Secretの作成とKustomization設定
          - プロジェクトルートに`.sops.yaml`を作成し、KMSキーで暗号化する設定をする
          - FrontendまたはBackendに任意のSecretマニフェストを作成してSOPSで暗号化
          - kustomization.yamlでsecretGeneratorとしてKSOPSを設定
            ```yaml
            generators:
            - ksops.yaml
            ```
          - ksops-generator.yamlを作成してSOPS暗号化ファイルを指定
            ```yaml
            apiVersion: viaduct.ai/v1
            kind: ksops
            metadata:
              name: ksops
              annotations:
                config.kubernetes.io/function: |
                    exec:
                      path: ksops
            files:
              - secret.yaml
            ```
      - 動作確認
        - ブランチをプッシュしSOPSで暗号化されたマニフェストがArgoCDで復号化されデプロイされること
          - 動作確認のためArgoCDのApplication設定で同期ブランチを作業ブランチに変えてもいい
  - title: Terraformにおける機密情報の管理
    body: |
      Terraformでは、機密情報を安全に管理するために注意が必要です。

      ## Terraformでの機密情報
      - コードに機密情報をベタ書きにしてしまうとGitにコミットした際に漏洩するリスクがある
      - tfstateに機密情報を含む設定した値が書かれる

      ## 対策方法

      - コードの機密情報の対策
        - コードに書く機密情報はダミー値を使いignore_changesにしてデプロイする。運用で使う値は別途マネージメントコンソール等で変更する
        - Secret Manager等の外部ストアを使用して機密情報を管理する。コードではdataを使い値を参照する
        - SOPS等の暗号化ツールを使い値を暗号化。コードではdataを使い値を参照する
      - tfstateの機密情報の対策
        - tfstateへのアクセスを制限する

      本プラクティスでは、SOPSを使用した機密情報の暗号化とtfstateへのアクセス制限を行います。

      ## SOPSの概要
      - **SOPS**はYAML/JSONファイルの値を暗号化するCLIツール
      - **KMSやPGPキー**を使用して暗号化
      - YAML/JSONの値のみを暗号化し、構造は可読性を保持
      - **暗号化されたファイルをGitで管理** - 機密情報を安全にバージョン管理

      ## SOPSによる暗号化手順
      - (事前準備) KMS等の暗号化キーを用意
      - SOPSコマンドを使用して機密情報を含むファイルを暗号化
      - TerraformはSOPSプロバイダーを使い暗号化されたファイルをdataで参照

      ## SOPSのTerraform統合
      - Terraformには[SOPS](https://registry.terraform.io/providers/carlpett/sops/latest/docs)プロバイダーがある
      - Terraform実行時にSOPSプロバイダーが暗号化されたファイルを復号化し、値を参照できるようにする

      # プラクティス
      - SOPS用のKMSキーを作成（別issue、SOPSを使ったK8s Secretの暗号化で作成済なら不要）
        - KMSのTerraformコードは`codes/sops/terraform`に配置
        - KMSキーにアクセスできるIAMユーザーを制限する
        - プロジェクトのrootに`.sops.yaml`を作成し、作成したKMSキーで暗号化する設定をする
      - SOPSを使用した機密情報の暗号化の実装
        - 適当なKey/Valueをもったyamlファイルを`codes/sops/terraform`に作成
        - SOPSでそのyamlファイルを暗号化
        - `codes/sops/terraform`にSecretManagerのTerraformコードを作成
          - SecretManagerに保管する値はSOPSで暗号化した値を参照する
      - tfbackendモジュールを改良しS3バケットにアクセスできるIAMユーザーを制限する
  - title: ノードの暗号化
    body: |
      EKSのノードは一時的なものとして使うことが多いですが、一時的に機密情報を格納することもあります。そのため、ノードの暗号化を行うことで、機密情報の漏洩リスクを低減できます。

      # ノードの暗号化の必要性
      - ノードのEBSボリュームに機密情報が格納されることがある
      - 物理的な不正アクセスにより、機密情報が漏洩するリスクがある
      - ノードのEBSボリュームを暗号化することで、機密情報の漏洩リスクを低減できる 
      
      # 解決策
      - EBSデフォルトの暗号化を有効にし、新規に作成されるEBSボリュームを自動的に暗号化する
      - （Fargate、EKS AutoModeの場合）ノードディスクはデフォルトで暗号化される
      
      本プラクティスでは EKS AutoMode におけるノードの暗号化を確認します。

      # EKS AutoModeのノード暗号化
      - EKS AutoModeでは、ノードのEBSボリュームがデフォルトで暗号化される
      - 暗号化はAWS KMSを使用して行われ、デフォルトではAWSマネージドの`aws/ebs`キーが使用される
      - `nodeclass`リソースの`spec.ephemeralStorage.kmsKeyID`で任意のKMSキーを指定することも可能
      
      # プラクティス
      
      - EKS AutoModeのノード暗号化を確認する
        - EKS AutoModeのワーカーノードを確認し、EBSボリュームが`aws/ebs`キーで暗号化されていることを確認する

      ## 更に発展的なプラクティス
      このプラクティスは余裕がなければやらなくてもいいです。

      CMKを使いノードのEBSボリュームを暗号化する。
      新規にnodeclassおよびnodepoolを作成し、ノードのEBSボリュームをカスタマーKMSキーで暗号化する。

      - ノード暗号化用のカスタマーKMSキーを作成する
      - `nodeClass`および`nodePool`を新たに作成する
        - `nodeClass`の`spec.ephemeralStorage.kmsKeyID`にカスタマーKMSキーを指定する
        - `nodePool`にはノードに任意のラベルを付与する
      - 作成し`nodePool`でPodを起動させる。nodeSelector等でノードに付与した任意のラベルを指定するといい
      - 作成されたノードを確認しEBSがCMKで暗号化されていることを確認する

  - title: ServiceMeshによるPod間通信の暗号化（mTLS）
    body: |
      Service Mesh（サービスメッシュ）を使用してマイクロサービス間の通信にmTLS（相互TLS）認証を実装することで、Pod間通信のセキュリティを大幅に向上させることができます。

      # 課題や必要性
      - Kubernetes内のPod間通信はデフォルトで暗号化されておらず、通信内容の盗聴リスクがある
      - サービス間の認証・認可の仕組みがなく、なりすましの可能性がある
      - ネットワークレベルでの通信制御や可観測性が不十分
      - セキュリティポリシーの一元管理が困難

      # 解決策
      - Istio Service MeshによるmTLS実装
        - サイドカープロキシパターンでの実装
        - Ambient Meshモードでの実装（より軽量）
      - Linkerd Service Meshによる実装
      - Consul Connect による実装
      
      本プラクティスでは Istio の Ambient モードを採用します。従来のサイドカーモードと比較してリソース効率が良く、既存のアプリケーションを変更することなく透過的にmTLSを実装できるためです。

      # 解決策の説明
      Istio Ambient モードは、各ノードでztunnelプロキシが動作し、Pod間通信を透過的に傍受してmTLS暗号化を行います。
      - IstiodがCA（Certificate Authority）として動作し、SPIFFE証明書を管理
      - ztunnelが各ノードでL4プロキシとして動作し、mTLS terminationを実行
      - アプリケーションのコード変更やサイドカー注入が不要
      - 必要に応じてwaypoint proxyでL7レベルの制御も可能

      実装手順：
      - IstioのAmbient モードをEKSクラスタにインストール
      - 対象のNamespaceをAmbient meshに追加

      # プラクティス
      - IstioのAmbient モードをEKSクラスタに導入する [Istio / Install with Helm](https://istio.io/latest/docs/ambient/install/helm/)
        - Helmを使用してIstioの各コンポーネントをインストールする
          - istio-base（CRD等の基盤）
          - istiod（制御プレーン）
          - istio-cni（ネットワーク設定）
          - ztunnel（データプレーン）
      - frontendとbackendのNamespaceをAmbient meshに追加する
        - readiness/liveness ProbeとNetworkPolicyを設定しているとProbeに失敗する可能性あり。その場合は問題を解決する

      ## 更に発展的なプラクティス
      このプラクティスは余裕がなければやらなくてもいいです。

      - PrometheusとKialiを導入しmTLSで暗号化された通信の可視化をする [Istio / Secure and visualize the application](https://istio.io/latest/docs/ambient/getting-started/secure-and-visualize/)

  - title: Falcoによるランタイムセキュリティ監視
    body: |
      Falco は、CNCF（Cloud Native Computing Foundation）にホストされているOSSで、コンテナやKubernetesクラスタの異常な挙動をリアルタイムに検知するためのランタイムセキュリティエンジンです。

      [Falco公式ドキュメント](https://falco.org/docs/)

      ## Falcoの必要性

      - Kubernetesのデフォルト設定では多くの通信が許可されている
      - 静的なセキュリティ設定だけでは実行時の脅威を検出できない
      - コンテナブレイクアウトや特権昇格などの動的な攻撃への対応が必要

      ## Falcoで検出できる脅威

      Falcoは以下のようなセキュリティ脅威を検出できます。

      - **ファイルシステム攻撃**: システムファイルの不正な読み書き、設定ファイル改ざん
      - **プロセス異常**: 予期しないバイナリ実行、シェルスクリプトの異常実行

      他にもさまざまな脅威を検出可能です。Falcoがデフォルトで監視するルールは以下のリンクから確認できます。

      [Default Rules | Falco](https://falco.org/docs/reference/rules/default-rules/)

      ## FalcoのKubernetes統合

      ### Falcoの動作
      - ノードのシステムコールをドライバーを使って監視
        - EKS Automode のノードの場合は`Modern eBPF`を使用

      ### DaemonSet配置
      - 各ノードでカーネルイベントを監視するためDaemonSetとして配置
      - 全てのワーカーノードでのセキュリティ監視を実現
      - ノードレベルでのシステムコール監視

      ### 権限要件
      - カーネルアクセスのため**特権モード**での実行が必要
      - セキュリティコンテキストでの適切な権限設定
      - ホストのプロセスファイルシステムへのアクセス

      # プラクティス
      - FalcoをEKSクラスタに導入する
        - Helmチャートを使用してFalcoをインストール [Falcoをデプロイする | KubernetesでFalcoを試す](https://falco.org/docs/getting-started/falco-kubernetes-quickstart/#deploy-falco)
      - 動作確認のためbackendまたはfrontendでルールをトリガーする。Falcoのログに疑わしい挙動が出力されることを確認する [ルールをトリガーする | KubernetesでFalcoを試す](https://falco.org/docs/getting-started/falco-kubernetes-quickstart/#trigger-a-rule)

      # 発展的なプラクティス
      このプラクティスは余裕がなければやらなくてもいいです。

      - カスタムルールの作成
        - アプリケーション固有のセキュリティルール作成
        - ルールの優先度とノイズ対策の設定

  - title: GuardDuty EKS Protectionの有効化とセキュリティ監視
    body: |
      Amazon GuardDutyは、AWSアカウントおよびワークロードを脅威から保護するためのマネージド型脅威検出サービスです。EKSの脅威も検出可能です。

      [Amazon GuardDuty](https://docs.aws.amazon.com/ja_jp/guardduty/latest/ug/what-is-guardduty.html)

      ## EKS に関連したGuardDutyの機能

      - [EKS Protection](https://docs.aws.amazon.com/ja_jp/guardduty/latest/ug/kubernetes-protection.html)
      - [Runtime Monitoring](https://docs.aws.amazon.com/ja_jp/guardduty/latest/ug/runtime-monitoring.html)
      - [Malware Protection for EC2](https://docs.aws.amazon.com/ja_jp/guardduty/latest/ug/malware-protection.html)

      ### EKS Protection

      EKSクラスタの脅威を検出するための機能です。EKSの監査ログを使い、不正な操作を検出します。

      EKS Protection はアカウント単位で機能を有効または無効にします。

      以下の脅威を検出します。

      [EKS Protection の検出結果タイプ](https://docs.aws.amazon.com/ja_jp/guardduty/latest/ug/guardduty-finding-types-eks-audit-logs.html)

      ### Runtime Monitoring

      EKSクラスタ上で実行されるコンテナのランタイム挙動を監視し、リアルタイムで脅威を検出します。EC2ベースのワーカーノードでのみ利用可能です。

      Runtime Monitoring はアカウント単位で機能を有効または無効にします。

      さらに、EKSに GuardDuty セキュリティエージェント をデプロイすることで監視できます。導入方法は自動または手動が選べます。

      - 自動: GuardDutyがEKSにエージェントをデプロイします。デフォルトではすべてのEKSクラスタに対して自動的に有効になります。任意のクラスタを選択または除外できます。VPCエンドポイントが自動で作成されます。[Amazon EKS リソースのセキュリティエージェントの自動管理](https://docs.aws.amazon.com/ja_jp/guardduty/latest/ug/managing-gdu-agent-eks-automatically.html)
      - 手動: EKSクラスタにエージェントを手動でデプロイします。EKSアドオンで導入可能です。必要なVPCエンドポイントも手動で作成します。[Amazon EKS クラスターのセキュリティエージェントの手動管理](https://docs.aws.amazon.com/ja_jp/guardduty/latest/ug/managing-gdu-agent-eks-manually.html)

      以下の脅威を検出します。

      [GuardDuty Runtime Monitoring の検出結果タイプ](https://docs.aws.amazon.com/ja_jp/guardduty/latest/ug/findings-runtime-monitoring.html)

      ### Malware Protection for EC2

      EC2インスタン上のアプリケーション、コンテナで疑わしい動作を検出した際にEBSボリュームをスキャンし、マルウェアの検出を行います。EKSクラスタ上のEC2インスタンスで実行されるPodも対象です。

      スキャンは以下の脅威を検出した際に自動で行われます。また、オンデマンドで手動でスキャンも可能です。

      [GuardDuty 実行型マルウェアスキャンを起動する検出結果](https://docs.aws.amazon.com/ja_jp/guardduty/latest/ug/gd-findings-initiate-malware-protection-scan.html)

      以下の脅威を検出します。

      [Malware Protection for EC2 の検出結果のタイプ](https://docs.aws.amazon.com/ja_jp/guardduty/latest/ug/findings-malware-protection.html)

      # プラクティス
      - GuardDutyを有効化し、EKSを保護する
        - Terraformのguarddutyモジュールを作成する
        - アカウントでGuardDutyを有効化する（すでにアカウントで有効になっている場合はコード実装不要）
        - EKS Protectionを有効化（すでにアカウントで有効になっている場合はコード実装不要）
        - Runtime Monitoringを有効化（すでにアカウントで有効になっている場合はコード実装不要）
          - GuardDutyセキュリティエージェントをEKSクラスタに**手動**でデプロイする
          - VPCエンドポイントを作成する
        - Malware Protection for EC2を有効化（すでにアカウントで有効になっている場合はコード実装不要）
      - 以下で動作確認可能
        - EKSクラスタ内のcurlコマンドが実行できる任意のPod(frontend等)で以下を実行
          ``` bash
          curl http://169.254.169.254.sslip.io/latest/meta-data/
          ```
        - しばらく(2分位)するとRuntime Monitoringで`UnauthorizedAccess:Runtime/MetadataDNSRebind`が検出される。また、それを契機にMalware protection for EC2がEBSをスキャンする。

  - title: 静的解析ツールによるTerraformのセキュリティスキャン
    body: |
      TerraformやK8sマニフェストを静的解析ツールを使用してスキャンすることで、セキュリティの脆弱性や設定ミスを事前に検出できます。Infrastructure as Code（IaC）のセキュリティベストプラクティスに従っているかを自動的にチェックすることで、安全なインフラ構築を実現できます。

      # 静的解析の必要性
      - IaCに含まれるセキュリティ上の問題を早期に発見
      - 設定ミスによるセキュリティリスクの軽減
      - セキュリティベストプラクティスの遵守を自動化
      - コードレビュー時のセキュリティチェックを効率化

      # 解決策の選択肢
      - Checkov - Bridgecrew（現Prisma Cloud）が開発したオープンソースのIaCセキュリティスキャナー
      - tfsec - Terraformに特化したセキュリティスキャナー（現在はTrivyに統合）
      - Terrascan - Tenable社が開発したIaC用セキュリティスキャナー
      - Trivy - Aqua Security社が開発した多機能セキュリティスキャナー

      本プラクティスではTrivyを採用します。Trivyは多機能で軽量、かつ活発に開発されており、Terraformの他にもコンテナイメージ、Kubernetes、設定ファイルなど幅広いスキャンに対応しているためです。

      # Trivyによる静的解析
      Trivyは包括的なセキュリティスキャナーで、以下の機能を提供します：
      - Terraformコードの設定ミスやセキュリティ問題の検出
      - コンテナイメージの脆弱性スキャン
      - Kubernetesマニフェストのセキュリティ設定チェック
      - ファイルシステムの脆弱性スキャン

      ## Terraformスキャンで検出される問題例
      - S3バケットのパブリックアクセス設定
      - セキュリティグループの過度に緩い設定（0.0.0.0/0の許可等）
      - 暗号化が無効になっているリソース
      - IAMポリシーの過度な権限付与
      - ログ記録が無効になっているサービス
      - パスワードやアクセスキーのハードコード

      ## スキャン手順
      1. Trivyをインストール
      2. Terraformコードに対してスキャンを実行
      3. 検出された問題を確認・対応
      4. 必要に応じて設定を調整して再スキャン

      # プラクティス
      - Trivyを使用してTerraformコードのセキュリティスキャンを実行する
        - Trivyをインストール（手順は公式ドキュメント参照[Installing Trivy](https://trivy.dev/v0.57/getting-started/installation/)）
        - `/codes/`ディレクトリ配下の任意のTerraformコードとK8sマニフェストを以下のようにスキャンする
          ```bash
          trivy config codes/
          ```
        - 検出されたセキュリティ問題を確認し、重要度の高い問題に対応する
        - 対応後、再スキャンを実行して問題が解決されたことを確認する

  - title: SBOMによるソフトウェア部品の可視化
    body: |
      SBOM（Software Bill of Materials）は、ソフトウェアに含まれるコンポーネント、ライブラリ、依存関係を詳細に記録した"部品表"です。コンテナイメージのSBOMを生成・分析することで、使用しているソフトウェア部品を可視化し、脆弱性管理やライセンス管理を効率化できます。

      # SBOMの必要性
      - 現代のソフトウェアは多数のオープンソースライブラリや第三者製コンポーネントに依存
      - 使用している部品を把握していないと、脆弱性発見時の影響範囲が不明
      - ライセンス違反や法的リスクの回避が困難
      - セキュリティインシデント発生時の迅速な対応が不可能

      # 解決策
      - SBOMの自動生成によるソフトウェア部品の可視化
        - Trivyを使用したコンテナイメージからのSBOM生成
        - SPDX/CycloneDX形式での標準化されたSBOM出力
        - CI/CDパイプラインへの統合による継続的なSBOM生成

      本プラクティスではTrivyを採用します。既に静的解析プラクティスで導入済みのTrivyを使用することで、ツールの運用負荷を軽減しつつ、効率的なSBOM生成を実現します。

      # SBOMの活用方法

      ## ソフトウェア部品の可視化とガバナンス
      - **部品の包括的な可視化** - コンテナイメージに含まれる全パッケージとバージョン、直接的・間接的依存関係を明示
      - **ライセンス情報の管理** - ライセンス情報の収集・一元管理による法的リスクの回避
      - **監査とコンプライアンス** - 監査対応時の迅速な情報提供と使用パッケージの承認プロセス効率化
      - **サプライチェーンリスク管理** - 使用ソフトウェア部品のサプライチェーンリスクの可視化と評価

      ## 標準フォーマット
      - **SPDX（Software Package Data Exchange）** - Linux Foundationが主導する標準フォーマット
      - **CycloneDX** - OWASP主導のセキュリティ重視の軽量フォーマット
      - 両フォーマットとも業界標準として広く採用

      # プラクティス
      - Trivyで`CycloneDX`形式のSBOMを生成

      ## 更に発展的なプラクティス
      このプラクティスは余裕がなければやらなくてもいいです。

      **Dependency-Track**は、SBOMを活用したソフトウェア構成分析のためのOWASPプロジェクトです。複数プロジェクトのSBOMを統合管理し、脆弱性の継続監視やライセンス管理をWebダッシュボードで行えます。

      - Dependency-Trackによる可視化の実装
        - helmでDependency-TrackをEKSにデプロイ [Deploying on Kubernetes | Dependency-Track](https://docs.dependencytrack.org/getting-started/deploy-kubernetes/)
        - Dependency-Trackに接続し、Trivyで作成したSBOMをアップロードして可視化
