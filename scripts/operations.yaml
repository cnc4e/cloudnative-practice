issues:
  - title: Checkovによるポリシーチェック
    body: |
      # 本Issueでやること
      プロジェクト独自のルールや規約（命名規則、タグ付けルール、リージョン制約など）を自動的に検査し、遵守を確保することは重要です。ポリシーチェックツールを使用することで、これらのプロジェクト固有のルールとセキュリティベストプラクティスの両方を自動検査し、コードの品質とセキュリティを向上させることができます。

      # ポリシーチェックの必要性
      - プロジェクト固有のルール（命名規則、タグ付け、リージョン制約）の遵守確認が必要
      - 複数開発者による一貫した設定の維持とコードの統一性の確保
      - 手動によるルール確認は時間がかかり、見落としやヒューマンエラーが発生しやすい
      
      # 解決策
      - **Checkov**: YAMLベースの直感的なカスタムポリシー定義、TerraformとKubernetes両対応（本プラクティス採用）
      - **Trivy**: 高速実行、統合セキュリティスキャナー、カスタムポリシーはOPA/Regoが必要
      - **Terrascan**: OPA/Regoベース、柔軟だが学習コストが高い
      - **KICS**: 独自のクエリ言語、カスタムポリシー作成が複雑
      
      本プラクティスではYAMLでのカスタムポリシー定義が容易で、TerraformとKubernetesの両方に対して統一的なポリシー管理が可能なCheckovを採用します。

      # Checkovによるポリシーチェック
      - Checkovは1000以上のセキュリティ・コンプライアンスチェックを内蔵
      - Terraform、Kubernetes、Docker、CloudFormationなど多様な形式をサポート
      - カスタムポリシーの作成により組織固有のルールを適用可能
      - JSON、SARIF、JUnit形式での結果出力によりCI/CD統合が容易

      ## Checkovのインストールと基本的な使い方

      - [Quick Start - checkov](https://www.checkov.io/1.Welcome/Quick%20Start.html)

      ## 主要なチェック項目

      checkovでは標準機能で以下のベストプラクティスを満たしているかコードのスキャンを行います。
      - Kubernetesマニフェスト（YAML）に対するチェック: [kubernetes resource scans - checkov](https://www.checkov.io/5.Policy%20Index/kubernetes.html)
      - Terraformコード（.tf）に対するチェック: [terraform resource scans - checkov](https://www.checkov.io/5.Policy%20Index/terraform.html)

      ## カスタムポリシーの作成

      主要なチェック項目とは別に独自のルールを作成したい場合、カスタムポリシーの作成を行います。
      [Custom Policies Overview - checkov](https://www.checkov.io/3.Custom%20Policies/Custom%20Policies%20Overview.html)

      # プラクティス

      ## 導入
      - checkovをローカル端末にインストール
      - `checkov --version`コマンドを実行し、バージョンが表示されること

      ## 基本的なCheckovスキャン
      - カスタムポリシーを定義し、プロジェクトのルールを自動検査
      - 今回はあえてチェックに`失敗`するようなポリシーを定義（作成したポリシーを別のissueで使います。）
        - codes/checkovディレクトリを作成
        - ディレクトリ内にカスタムポリシーのYAMLを作成
          - ポリシーのIDは`CUSTOM_AWS_PROVIDER_CHECK`にする
          - `policy_type`は`terraform`にする（指定しないと次のIssueでスキャンが実行されないため）
          - TerraformのAWSプロバイダーにdefault_regionが`us-west-1`である事を確認
      - 作成したポリシーを使いcheckovを実行しカスタムポリシーの確認結果が`FAILED`になることを確認
        - 対象は`codes/actions/terraform`ディレクトリなど任意
        - `--check "CUSTOM_*"`を付けるとカスタムポリシーのみチェックできる（付けないと大量の`FAILED`が出てしまう）

      実行例
      ```sh
      $ checkov -d . --external-checks-dir /path/to/codes/checkov --check CUSTOM_AWS_PROVIDER_CHECK
      [ terraform framework ]: 100%|████████████████████|[3/3], Current File Scanned=iam_role.tf
      [ secrets framework ]: 100%|████████████████████|[3/3], Current File Scanned=./_versions.tf

      terraform scan results:

      Passed checks: 0, Failed checks: 1, Skipped checks: 0

      Check: CUSTOM_AWS_PROVIDER_CHECK: "Ensure AWS provider region is us-west-1"
              FAILED for resource: aws.default
              File: /_versions.tf:1-1
      ```
  - title: CheckovによるポリシーチェックをCIに組み込む
    body: |
      # 本Issueでやること
      CI/CDパイプラインにポリシーチェックを統合することで、開発者が変更をプッシュする度に自動的にセキュリティとコンプライアンスの検証を行い、問題のあるコードが本番環境にデプロイされることを防げます。

      # CI統合の必要性
      - 開発者の手動実行に依存すると、ポリシーチェックが忘れられる可能性がある
      - プルリクエスト時点での自動検証により、早期に問題を発見・修正できる
      - 継続的なセキュリティとコンプライアンスの維持が可能になる
      - チーム全体での一貫したポリシー適用の強制ができる
      
      # 解決策
      - **GitHub Actions**: 無料プラン利用可能、Checkovの公式アクションあり、設定が簡単（本プラクティス採用）
      - **GitLab CI**: GitLab利用時の選択肢、Dockerイメージでの実行
      - **Jenkins**: 自前構築が必要、柔軟性が高い
      - **CircleCI**: 有料プラン必要、高性能な実行環境
      
      本プラクティスではGitHub Actionsを使用し、プルリクエスト時に自動的にCheckovスキャンを実行する仕組みを構築します。

      # GitHub ActionsでのCheckov統合
      - Checkovには公式のGitHub Actionが提供されている
      - プルリクエスト作成時およびコードプッシュ時に自動実行
      - 結果をプルリクエストのコメントに表示可能
      - 失敗時のワークフロー停止により問題のあるマージを防止

      # プラクティス

      ## 前提

      - Checkovによるポリシーチェック のissueを完了していること

      ## CI統合のためのワークフロー作成
      - `.github/workflows/`ディレクトリに`checkov.yml`ワークフローファイルを作成
      - mainへのプルリクエストをトリガーとしてワークフローを実行
      - [checkov-action](https://github.com/bridgecrewio/checkov-action)を参考にcheckovを実行
        - Terraformディレクトリ（`codes/actions/terraform`等）をスキャン
        - フレームワークは`terraform`
        - カスタムポリシー（`codes/checkov/`）を使用
        - チェックは`CUSTOM_*`のみ

      ## ワークフローのテスト
      - 作業ブランチをリモートにプッシュしPRを作成
      - GitHub Actionsでチェックが自動で行われ**失敗**することを確認
      - `codes/checkov`配下のポリシーを修正しリモートに再プッシュ
      - GitHub Actionsでチェックが自動で行われ**成功**することを確認

      ## 更に発展的なプラクティス
      このプラクティスは余裕がなければやらなくてもいいです。

      - 対象ディレクトリをハードコードではなく変更のあったTerraformディレクトリにする

  - title: AtlantisによるPRベースのterraform plan/apply
    body: |
      # 本Issueでやること
      Pull Requestベースでのインフラ管理により、レビュープロセスを通じてインフラストラクチャの変更を制御し、変更内容の可視化とガバナンスを強化できます。Atlantisを使用することで、GitOpsワークフローを実現し、Pull Request上で直接terraform planの結果を確認し、レビュー後にterraform applyを実行できます。

      # PRベースインフラ管理の必要性
      - Terraformの実行が個人のローカル環境に依存し、状態管理や権限管理が困難
      - インフラ変更のレビュープロセスが不十分で、予期しない変更が本番環境に反映されるリスク
      - 複数人でのインフラ管理において、実行履歴の追跡と変更の透明性が不足
      - ローカル環境での実行により、一貫性のない実行環境とコンフィグレーションの問題
      
      # 解決策
      - **Atlantis**: GitHubとの統合が優れており、PRコメントでの操作が直感的（本プラクティス採用）
      - **Terraform Cloud**: HashiCorpの公式サービス、リモート実行とstate管理が統合
      - **GitHub Actions**: 自前でワークフローを構築、カスタマイズ性が高い
      - **GitLab CI**: GitLab利用時の選択肢、統合開発環境として利用可能
      
      本プラクティスではGitHub Pull Requestとの親和性が高く、コメントベースでの直感的な操作が可能なAtlantisを採用します。

      # Atlantisによる GitOps ワークフロー
      - Pull Request作成時に自動的にterraform planを実行
      - plan結果をPRコメントに表示し、変更内容を事前に確認可能
      - レビュー承認後、コメントによりterraform applyを実行
      - 実行ログとstate管理を一元化し、トレーサビリティを確保

      ## Atlantisの主要機能
      - **自動plan実行**: PR作成/更新時の自動terraform plan実行
      - **PRコメント統合**: planとapplyをPRコメントから実行
      - **ポリシーチェック**: Conftest等によるOPAポリシー適用
      - **並列実行制御**: 同時実行の制限とロック機能

      # プラクティス

      ## 前提
      - StorageClassを作成してある（issue: クラスタ StorageClassによる動的ボリューム作成）
      - IngressClassを作成してある (issue: クラスタ Ingressによる外部公開)

      ## Atlantisサーバーの構築
      公式のドキュメントを参考にAtlantisをKubernetesにデプロイする。
      - [Installation Guide | Atlantis](https://www.runatlantis.io/docs/installation-guide.html)
      - 認証情報はARCで作ったPATを使用。**認証情報はGitに含めない**ように注意
      - AtlantisのAWSクレデンシャルはPod IdentityでIAMロールを付与
        - AtlantisのIAMロールからtfbackendへアクセスする。S3のリソースベースポリシーでIAMロールの制限をしている場合、Atlantis用のIAMロールを追加する

      1. runatlantisのヘルムチャートリポジトリをhelmに追加
         ```
         helm repo add runatlantis https://runatlantis.github.io/helm-charts
         ```
      2. `helm inspect values runatlantis/atlantis > values.yaml`コマンドを実行し、values.yamlファイルを生成し、以下を修正する
         - `fullnameOverride`は`atlantis`
         - `orgAllowlist`は`github.com/cnc4e/*`
         - `type`は`ClusterIP`
         - `ingressClassName`は`alb`
         - `ingress`の`path`は`/events`
         - ストレージクラス設定は以下の通りであることを確認する（デフォルトのストレージクラス設定を利用する）
           ```yaml
           volumeClaim:
             enabled: true
             dataStorage: 5Gi
             storageClassName: ""
           ```
      3. Webhook Secretを作成する
         - `kubectl -n atlantis create secret generic atlantis-webhook-secret --from-literal=secret=<任意の文字列>`コマンドを実行し、Secretを作成する
         - GitHubリポジトリ > Settings > Webhooks > Add webhookでWebhookを設定する
           - Payload URLは`https://<Ingress(ALB)のDNS名>/events`
           - Content typeは`application/json`
           - Secretは`create secret generic`コマンドで入力した`<任意の文字列>`
           - SSL verificationは`Disable (not recommended)`
           - "Which events would you like to trigger this webhook?"は`Let me select individual events.`を選択し、`Pull requests`・`Pull request reviews`・`Pushes`・`Issue comments`にチェック
           - `Active`にチェック
      4. 以下のコマンドを実行しインストールする
         ```sh
         export USER=<User Name>
         export GITHUB_TOKEN=<GitHub Personal Access Token>
         export WEBHOOKSECRET=<Webhook Secret>

         helm install atlantis runatlantis/atlantis -f values.yaml \
           --set github.user=${USER} \
           --set github.token=${GITHUB_TOKEN} \
           --set github.secret=${WEBHOOKSECRET}
         ```
         - `helm install`のコマンド全文を`codes/atlantis/k8s`ディレクトリ配下の`README.md`に書いて保存すること

      ## 動作確認
      - Terraformのコードを修正したコミットをプッシュし、PRを作成する
      - Atlantisにより自動でplanが実行され結果がPRにコメントされることを確認する

  - title: GitHub Actionsによる定期的なドリフトチェック
    body: |
      # 本Issueでやること
      Terraformで管理されているインフラストラクチャは、手動変更やAWS側の自動的な変更により、実際のリソース状態とTerraformの状態ファイルに差異（ドリフト）が発生することがあります。定期的なドリフトチェックにより、これらの差異を早期発見し、インフラの整合性を維持できます。

      # ドリフトチェックの必要性
      - 手動でのAWSコンソール操作により、Terraform管理外での変更が発生する可能性
      - AWSサービスの自動更新やメンテナンスによる予期しない設定変更
      - チーム内での緊急対応時の手動変更により、Terraform状態との乖離が発生
      - 長期間運用していると、小さな差異が積み重なり大きな問題に発展するリスク
      
      # 解決策
      - **GitHub Actions**: 無料プラン利用可能、スケジュール実行対応、Terraformとの統合が容易（本プラクティス採用）
      - **AWS Systems Manager**: AWSネイティブサービス、CloudWatchアラーム連携可能
      - **Jenkins**: 自前構築が必要、柔軟性が高いが運用コストが高い
      - **CircleCI**: 有料プラン必要、高性能だが継続的な費用が発生
      
      本プラクティスではGitHub Actionsのscheduled workflowを使用し、定期的にterraform planを実行してドリフトを検出します。

      # GitHub Actionsによるドリフト検出
      - cronスケジュールによる定期実行（毎日、週次等）
      - terraform planの実行結果から差分の有無を判定
      - ドリフト検出時のSlack通知やGitHub Issue自動作成
      - 複数のTerraformディレクトリを並列チェック

      ## ドリフト検出の仕組み
      - `terraform plan -detailed-exitcode`を使用して差分の有無を判定
        - 終了コード0: 差分なし
        - 終了コード2: 差分あり（ドリフト検出）
        - その他: エラー発生
        - GitHub Actionsで`hashicorp/setup-terraform`アクションを使う場合、デフォルトではラッパースクリプト経由でterraformコマンドが実行されるため、実際の終了コードに関わらず0が返ってしまう。`terraform_wrapper: false`を指定し、`-detailed-exitcode`の終了コードがそのまま取得できるようにする
      - 検出された差分内容をSlackやメールで通知
      - 重要度に応じて自動Issue作成や担当者への直接通知

      # プラクティス

      - 定期ドリフトチェックワークフローの作成
        - `.github/workflows/`ディレクトリに`drift-check.yml`ワークフローファイルを作成
        - ワークフローは`arc-runner-set`で実行
        - cronスケジュールでワークフローを定期実行
          - 動作確認時は作業ブランチのpushをトリガーにしてもいい
        - 任意のTerraformディレクトリでドリフトチェックを実行
        - `hashicorp/setup-terraform`アクションを使う場合は`terraform_wrapper: false`を指定する（指定しないと`terraform plan -detailed-exitcode`が常に終了コード0を返し、ドリフトがあっても処理が失敗しない）
        - ドリフト検出時は処理を失敗させる
      - arc-runnerのIAMにtfbackendへのアクセス権とAWSへのReadOnlyAccess権を付与
      - tfbackendのリソースポリシーでarc-runnerのIAMロールを許可する

      ## 更に発展的なプラクティス
      このプラクティスは余裕がなければやらなくてもいいです。

      - ドリフト検知時はAWS SNS等を使い通知する
        - SNSへの発行権限（`sns:Publish`）をarc-runnerのIAMロールに付与する
        - 動作確認は、AWSコンソールでS3バケットのバージョニングを一時的に停止するなどしてドリフトを発生させ、SNS通知が飛ぶことを確認する
      - ドリフト検知をすべてのTerraformディレクトリに対して行うようにする
  - title: ブランチ戦略
    body: |
      # 本Issueでやること
      **本issueは内容を確認するだけでクローズしてください。**

      効果的なブランチ戦略により、チーム開発における機能開発、バグ修正、リリース管理を体系化し、コードの品質とリリースの安定性を向上させることができます。適切なブランチ戦略は、並行開発の効率化と競合の最小化を実現します。

      ## ブランチ戦略とは

      Gitなどのバージョン管理で、「どんな目的のブランチを、いつ・どこから切って、どうマージするか」を決めた運用ルールのことです。

      ## ブランチ戦略の必要性

      - **並行開発の管理** - 複数の機能を同時に開発する際の作業分離とコンフリクト回避
      - **品質の担保** - コードレビューとテストによる品質管理の標準化
      - **リリース管理** - リリース準備、ホットフィックス、実験的機能の独立した管理
      - **メインブランチの安定性** - 本番環境にデプロイ可能な状態を常に維持

      ## 主要なブランチ戦略

      参考:
      - [Introduction to GitLab Flow | GitLab](https://docs.gitlab.co.jp/ee/topics/gitlab_flow.html)
      - [git-flow, github-flow, gitlab-flowについて - Qiita](https://qiita.com/ucan-lab/items/371cdbaa2490817a6e2a)

      ### GitHub Flow
      - **特徴** - シンプルな構造、軽量、継続デプロイに適している
      - **適用場面** - 小規模チーム、頻繁なデプロイ、Web アプリケーション
      - **ブランチ構成**
      ```
      main             # 常にデプロイ可能な状態を保つメインブランチ
      ├─ feature/xxx   # 機能追加ブランチ。mainから切り、mainにマージする
      ├─ feature/yyy
      └─ fix/zzz       # 修正ブランチ。mainから切り、mainにマージする
      ```

      ### Git Flow
      - **特徴** - 複雑だが体系的、リリース管理が厳格。役割の異なる複数のブランチを組み合わせて運用する
      - **適用場面** - 大規模プロジェクト、定期的なリリースサイクル
      - **ブランチ構成**
      ```
      main      : 本番リリース済みのコードを管理するブランチ
      develop   : 次期リリースへの開発を統合するブランチ（mainから分岐）
      feature/* : 機能開発ブランチ（developから切り、developにマージ）
      release/* : リリース準備ブランチ（developから切り、リリース後mainとdevelopにマージ）
      hotfix/*  : 本番緊急対応ブランチ（mainから切り、mainとdevelopにマージ）
      ```

      ### GitLab Flow
      - **特徴** - GitHub FlowとGit Flowの中間的な位置。環境ごとのブランチを用いて段階的にリリースする
      - **適用場面** - 環境ごとのブランチ管理が必要な場合
      - **ブランチ構成**
      ```
      main               # 開発のベースとなるブランチ
      ├─ staging         # ステージング環境にデプロイされるブランチ
      │  └─ feature/*    # 機能開発ブランチ
      └─ production      # 本番環境にデプロイされるブランチ
      ```

      ## このプロジェクトでのブランチ戦略

      本プラクティスリポジトリでは**Issue番号ベースのGitHub Flow**を採用しています：

      ### ブランチ命名規則
      - **機能開発** - `{issue番号}-{機能名}` (例: `42-atlantis`, `44-branch-strategy`)

      ### コミットメッセージ規則
      - **形式** - `#{issue番号} {内容}` (例: `#42 Atlantisの設定を追加`)
      - **目的** - Issue番号を含めることでトレーサビリティを確保

      ### ワークフロー
      1. **Issue作成** - GitHub IssueでタスクやバグReportを管理
      2. **ブランチ作成** - Issue番号を含むブランチを作成
      3. **開発・コミット** - Issue番号を含むコミットメッセージで作業
      4. **プルリクエスト** - mainブランチへのマージリクエスト作成
      5. **レビュー・マージ** - コードレビュー後にmainブランチへマージ
  - title: リポジトリ設定
    body: |
      # 本Issueでやること
      プロジェクトの品質とセキュリティを維持するため、GitHubリポジトリの適切な設定により、コードの保護、レビュープロセスの強制、自動化されたチェックの実行を確保することが重要です。

      # リポジトリ設定の必要性
      現状のリポジトリ設定には、以下のような課題があります。

      ### 課題①：mainブランチに直接pushできてしまう
      - 問題点: テストやレビューを通さずにコードが反映されてしまう
      - 起きること: 不具合や設定ミスがそのまま本番コードに入るリスクがある
      - 対応の方向性: mainブランチへの直接pushを禁止し、必ずPR経由にする

      ### 課題②：プルリクエスト時のチェックが必須になっていない
      - 問題点: テストやセキュリティチェックを実行せずにマージできてしまう
      - 起きること: 品質やセキュリティが担保されないまま変更が取り込まれる
      - 対応の方向性: PRマージ前にテスト/セキュリティスキャン/ポリシーチェックを必須にする

      ### 課題③：管理者権限の付与が適切に制御されていない
      - 問題点: 管理者権限を付与すべきでない人物にも権限が付与されている
      - 起きること: 保護設定を回避されてしまい、意図しない変更やルール無視の運用が発生する
      - 対応の方向性: 管理者権限は最小限の担当者のみに付与する

      ### 課題④：コードレビューが省略されてしまう
      - 問題点: レビューをせずに変更を取り込めてしまう
      - 起きること: 品質低下やセキュリティ問題を見逃す可能性が高まる
      - 対応の方向性: PRに最低1人以上の承認レビューを必須にする

      # 解決策

      - **保護されたブランチ（Branch Protection Rules）**
        従来から提供されているブランチ保護機能。
        ブランチ単位での設定が可能で、設定が比較的簡単なため広く利用されている。

      - **ルールセット（Repository Rulesets）**
        新しく提供されたリポジトリ保護機能。
        複数のブランチやタグに対して、より柔軟かつ統一的にルールを適用できる。

      本プラクティスでは、より柔軟で包括的な管理が可能な「ルールセット（Repository Rulesets）」を採用し、リポジトリ全体の保護を強化する。

      # ルールセットによるリポジトリ保護

      [ルールセット](https://docs.github.com/ja/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets)は、従来の保護されたブランチ機能を拡張し、より柔軟で包括的なリポジトリルール管理を提供します。

      ## ルールセットの主要機能

      - **Require a pull request before merging**: マージ前にプルリクエストを必須とし、レビューの実施や承認者数を設定できる
      - **Require status checks to pass before merging**: CI/CDが成功しない限り、マージを許可しない
      - **Block force pushes**: 履歴を書き換える強制プッシュ(force push)を禁止する
      - **Restrict deletions**: ブランチの削除を制限する

      # プラクティス

      ※GitHub無料プランのprivateリポジトリを利用している場合はルールセットの適用ができません。本プラクティスは確認のみ実施し、クローズしてください。

      ルールセットを設定してGitHubリポジトリを保護します。
      本プラクティスでは、人間の操作とArgoCD ImageUpdaterの操作を制御するルールを設定します。

      GitHubのWEB画面 > Settings > Branches > Add branch ruleset より、以下のルールセット追加を行います。

      ### 人間の操作/ArgoCD ImageUpdaterの操作の両方を制御するルールを設定する
      - リポジトリの削除を防ぐルールを設定
        - ルールセット名: `main-branch-delete-protection`
        - Enforcement status: `Active`に設定
        - Bypass list: `Repository admin`を指定
        - 対象ブランチ: `main`ブランチを指定
        - 以下のルールを有効化
          - "Restrict deletions"

      ### ArgoCD ImageUpdaterの操作を制御するルールを設定する
      - リポジトリの削除・mainブランチへの直接プッシュを防ぐルールを設定
        - ルールセット名: `main-branch-push-protection`
        - Enforcement status: `Active`に設定
        - Bypass list: ArgoCDで使用したGitHub Appsを指定 ※Bypassを設定しない場合、ArgoCD ImageUpdaterによる自動更新が停止するため注意
        - 対象ブランチ: `main`ブランチを指定
        - 以下のルールを有効化
          - "Restrict deletions"
          - "Block force pushes"
          - "Require a pull request before merging"
            - Required approvals: 1
            - "Dismiss stale pull request reviews when new commits are pushed"

  - title: Terraform構成管理
    body: |
      # 本Issueでやること
      **本issueは内容を確認するだけでクローズしてください。**

      Terraformプロジェクトが成長するにつれて、リソース定義の増加や複雑な依存関係により、コードの管理が困難になります。適切な構成管理により、保守性、再利用性、可読性を向上させ、チーム開発での効率的なインフラストラクチャ管理を実現できます。

      # Terraform構成管理の必要性
      - 単一ファイルでの大量リソース定義により、可読性と保守性が著しく低下
      - 環境間（dev、staging、prod）での設定差異の管理が複雑化
      - チーム開発において、同時変更による競合や影響範囲の把握が困難
      - リソース変更時の影響範囲が不明確で、予期しない副作用のリスク

      # 解決策
      - **ディレクトリ分割**: リソース種別や機能別にファイルを分離、シンプルで理解しやすい、小規模〜中規模プロジェクトに適している（本プロジェクト採用）
      - **モジュール化**: 再利用可能なコンポーネントとして抽象化、複雑な構成に対応可能、大規模プロジェクトや複数環境管理に適している
      - **Terraformワークスペース**: 同一構成で複数環境を管理、環境別の状態分離が可能、シンプルな環境管理に適している

      本プロジェクトでは初心者でもわかりやすいディレクトリ分割のアプローチを採用しています。

      # ディレクトリ分割アプローチ
      - リソースの責務や機能に基づくファイル分離
      - 依存関係の明確化とdata sourceによるリソース参照
      - コード自体の複雑性は低く、初心者にも理解しやすい

      ## 基本的なディレクトリ構成（環境軸）
      - 各環境ごとにディレクトリを分け、さらにモジュールごとにサブディレクトリを作成
      - 環境を増やす場合は、既存の環境ディレクトリをコピーして作成できる

      ```
      codes/
      ├── dev/          # 開発環境
      │   ├── network/      # ネットワーク関連モジュール
      │   ├── eks/          # EKS関連モジュール
      │   └── security/     # セキュリティ関連モジュール
      └── prd/          # 本番環境
          ├── network/      # ネットワーク関連モジュール
          ├── eks/          # EKS関連モジュール
          └── security/     # セキュリティ関連モジュール
      ```

      ## モジュール軸のディレクトリ構成
      - 各モジュールごとにディレクトリを分け、さらに環境ごとにサブディレクトリを作成
      - リソースを定義したコードの階層が近いため横ぐしの修正がしやすい

      ```
      codes/
      ├── network/    # ネットワーク関連モジュール
      │   ├── dev/       # 開発環境
      │   └── prd/       # 本番環境
      ├── eks/        # EKS関連モジュール
      │   ├── dev/       # 開発環境
      │   └── prd/       # 本番環境
      └── security/   # セキュリティ関連モジュール
          ├── dev/       # 開発環境
          └── prd/       # 本番環境
      ```

      # モジュール化アプローチ
      - 再利用可能なコンポーネントとしての抽象化
      - input変数とoutput値による明確なインターフェース定義
      - 複数環境での設定値の差分管理
      - コードを再利用できるが複雑性が増すため、チームのスキルレベルに応じて導入を検討

      ## モジュール化の構成例
      ```
      codes/
      ├── modules/        # 共通モジュール定義
      │   ├── network/      # ネットワーク関連モジュール(呼び出し先)
      │   ├── eks/          # EKS関連モジュール(呼び出し先)
      │   └── security/     # セキュリティ関連モジュール(呼び出し先)
      └── environments/   # 環境別設定
          ├── dev/          # 開発環境
          │   ├── network/    # ネットワーク関連モジュール(呼び出し元)
          │   ├── eks/        # EKS関連モジュール(呼び出し元)
          │   └── security/   # セキュリティ関連モジュール(呼び出し元)
          └── prd/          # 本番環境
      ```

      # Terraformワークスペースアプローチ
      - 同一構成で複数環境を管理、環境別状態ファイル分離
      - terraform.workspace変数による環境固有設定の制御
      - シンプルな環境切り替えと軽量な環境管理手法

  - title: K8sマニフェスト構成管理
    body: |
      # 本Issueでやること
      **本issueは内容を確認するだけでクローズしてください。**

      Kubernetesアプリケーションが成長するにつれて、マニフェストファイルの数が増加し、管理が複雑になります。適切な構成管理により、保守性、可読性、再利用性を向上させ、チーム開発での効率的なKubernetesアプリケーション管理を実現できます。

      # K8sマニフェスト構成管理の必要性
      現状のK8sマニフェスト構成管理には、以下のような課題があります。

      ### 課題①：単一ファイルで大量リソースの定義をしている
      - 問題点: Deployment、Service、ConfigMapなど多数のリソースを1つのマニフェストファイルにまとめて管理している
      - 起きること: 設定内容の把握や修正が困難になり、変更ミスや影響範囲の見落としが発生しやすくなる
      - 対応の方向性: リソース種別ごとにマニフェストファイルを分割し、可読性と保守性を向上させる

      ### 課題②：環境間のマニフェスト差分管理が明確でない
      - 問題点: 環境ごとの設定差分が明確に整理されておらず、手動調整やファイルコピーに依存している
      - 起きること: 環境間の設定ズレや反映漏れが発生しやすく、検証環境と本番環境で挙動が異なるリスクが高まる
      - 対応の方向性: 環境ごとの差分を整理した構成管理（ディレクトリ分割やKustomize等）を採用し、差分管理を明確化する

      ### 課題③：アプリケーション単位・機能単位のリソースが混在している
      - 問題点: アプリケーション単位の構成と機能単位の構成が混在しており、リソースの整理方針が統一されていない
      - 起きること: 変更時にどのアプリケーションや機能へ影響するのか判断しづらく、意図しない影響を与える可能性がある
      - 対応の方向性: アプリケーション単位・機能単位でディレクトリを分割し、変更影響範囲を明確にする

      ### 課題④：類似の設定が重複している
      - 問題点: 類似した設定が複数のマニフェストファイルに重複して記述されている
      - 起きること: 修正時に複数ファイルを同時に更新する必要があり、修正漏れや運用負荷が増大する
      - 対応の方向性: 共通設定を整理し、再利用可能な構成（共通ファイル化）にすることで、修正コストを削減する

      # 解決策

      ### 解決策①：ディレクトリ分割
      - アプリケーション単位・機能単位でマニフェストを分離し、構成をシンプルに保つ
      - 各リソースの責務が明確になり、可読性・保守性が向上する
      - 小規模〜中規模のプロジェクトに適している
      - 本プロジェクトの基本構造として採用

      ### 解決策②：Kustomize
      - ベースマニフェストに対して、環境差分（dev / prodなど）をパッチで管理
      - YAMLの重複を削減しつつ、Kubernetesネイティブに構成を定義可能
      - 本プロジェクトでは、frontend / backendなどのアプリケーションを本方式で管理

      ### 解決策③：Helm
      - テンプレート化されたマニフェスト（Helm Chart）を利用して構成を管理
      - values.yamlによる設定上書きで柔軟にカスタマイズ可能
      - 本プロジェクトでは、ArgoCDやAtlantisなどの外部コンポーネント導入に利用

      ### 解決策④：Argo CD ApplicationSets
      - 複数環境・複数アプリケーションへのデプロイ定義をまとめて管理
      - Gitの状態をもとに自動的にApplicationを生成
      - GitOpsに基づき「構成」と「デプロイ状態」を同期

      本プロジェクトでは初心者でもわかりやすいディレクトリ分割のアプローチを採用しています。

      # ディレクトリ分割アプローチ
      - アプリケーションや機能に基づくファイル分離
      - 環境別の設定値は同一ファイル内で管理
      - リソース種別ごとのファイル分割により、変更影響範囲を限定

      ## 基本的なディレクトリ構成（アプリケーション軸）
      - 各アプリケーション（フロントエンド、バックエンド）ごとにディレクトリを分割
      - リソース種別ごとにファイルを分離し、管理しやすい構成にする

      ```
      codes/
      ├── backend/
      │   ├── k8s/
      │   │   ├── deployment.yaml    # Deployment定義
      │   │   ├── service.yaml       # Service定義
      │   │   ├── configmap.yaml     # ConfigMap定義
      │   │   └── ingress.yaml       # Ingress定義
      │   └── app/                   # アプリケーションソースコード
      └── frontend/
          ├── k8s/
          │   ├── deployment.yaml    # Deployment定義
          │   ├── service.yaml       # Service定義
          │   ├── configmap.yaml     # ConfigMap定義
          │   └── ingress.yaml       # Ingress定義
          └── app/                   # アプリケーションソースコード
      ```

      # Kustomizeアプローチ
      - ベースマニフェストから環境別の差分（patch）を適用
      - YAML重複を削減し、DRY原則に従った構成管理
      - Kubernetesネイティブツールのため、追加ツールのインストール不要

      ## Kustomize構成例
      ```
      codes/
      ├── base/                     # 共通ベースマニフェスト
      │   ├── deployment.yaml
      │   ├── service.yaml
      │   └── kustomization.yaml
      └── overlays/                 # 環境別差分
          ├── dev/
          │   ├── kustomization.yaml
          │   └── patch-replica.yaml
          └── prod/
              ├── kustomization.yaml
              └── patch-replica.yaml
      ```

      # Helmアプローチ
      - テンプレート化による高度な抽象化と動的設定生成
      - values.yamlによる環境別設定管理
      - Helm Chartの再利用性と配布可能性

      ## Helm構成例
      ```
      codes/
      └── helm-charts/
          └── myapp/
              ├── Chart.yaml          # Chart情報
              ├── values.yaml         # デフォルト設定値
              ├── values-dev.yaml     # 開発環境設定
              ├── values-prod.yaml    # 本番環境設定
              └── templates/          # テンプレートファイル
                  ├── deployment.yaml
                  ├── service.yaml
                  └── ingress.yaml
      ```

  - title: EKSクラスタのバージョンアップ
    body: |
      # 本Issueでやること
      EKSクラスタは定期的に新しいKubernetesバージョンがリリースされ、セキュリティ修正や機能改善が提供されます。クラスタのバージョンを最新に保つことで、セキュリティの向上と新機能の活用が可能になります。

      # EKSバージョンアップの必要性
      現状のEKSクラスタ運用には、以下のような課題があります。

      ### 課題①：Kubernetesのサポート終了に伴うセキュリティリスクがある
      - 問題点: サポートが終了したKubernetesバージョンでは、セキュリティ更新が提供されない
      - 起きること: 既知の脆弱性が修正されず、クラスタ全体のセキュリティリスクが高まる
      - 対応の方向性: サポート期間内のKubernetesバージョンへ計画的にアップグレードする

      ### 課題②：最新機能やAPIを利用できず、開発効率が低下する
      - 問題点: 古いKubernetesバージョンでは、新機能や推奨APIを利用できない
      - 起きること: 開発・運用上の制約が増え、設計の自由度や開発効率が低下する
      - 対応の方向性: Kubernetesバージョンを最新に保ち、新機能や推奨APIを継続的に活用できる状態とする

      ### 課題③：AWSによるEKSコントロールプレーンの強制アップグレードリスクがある
      - 問題点: サポート期限を超えると、AWSによりコントロールプレーンの強制アップグレードが実施される
      - 起きること: 事前検証が不十分な状態でアップグレードが行われ、予期せぬ影響や障害が発生する可能性がある
      - 対応の方向性: サポート期限前に計画的なバージョンアップを実施し、影響をコントロール可能な状態とする

      ### 課題④：セキュリティパッチや重要な修正を取り込めていない
      - 問題点: 古いバージョンのままでは、不具合修正や安定性向上の改善が反映されない
      - 起きること: クラスタの安定性や信頼性が低下し、運用トラブルの原因となる
      - 対応の方向性: 定期的にEKS/Kubernetesのバージョンアップを行い、最新の修正と改善を取り込む

      参考
      - [EKS の Kubernetes バージョンライフサイクルを理解する](https://docs.aws.amazon.com/ja_jp/eks/latest/userguide/kubernetes-versions.html)

      # 解決策

      K8sクラスタの代表的なバージョンアップ戦略は以下2つがあります。

      - **インプレースアップグレード**: 既存のクラスタを直接更新する方式、シンプルで費用効率が良い（本プラクティス採用）
      - **ブルーグリーンアップグレード**: 新しいクラスタを作成して段階的に移行する方式、リスクは低いが費用と複雑性が増加

      本プラクティスでは運用の簡素化とコスト効率を重視し、インプレースアップグレード方式を採用します。

      ## インプレースアップグレード
      - **特徴**: 既存のクラスタ上で直接バージョンアップを実行
      - **利点**: 
        - コスト効率が良い（追加リソース不要）
        - シンプルな手順で実行可能
        - DNSやロードバランサーの設定変更が不要
      - **考慮点**: 
        - アップグレード中の一時的なサービス停止の可能性
        - 問題発生時のロールバックが困難

      ## ブルーグリーンアップグレード
      - **特徴**: 新しいバージョンのクラスタを並行して作成し、段階的に移行
      - **利点**: 
        - 問題発生時の迅速なロールバックが可能
        - 本番環境への影響を最小限に抑制
        - アップグレードテストを本格的に実施可能
      - **考慮点**: 
        - 2倍のリソース費用が一時的に発生
        - データベースやストレージの移行が複雑
        - DNS切り替えやトラフィック制御が必要

      # EKS AutoModeでのインプレースアップグレード
      - EKS AutoModeではコントロールプレーンのアップグレード後、ノードは自動的に新しいバージョンに更新される
      - アップグレード前の事前チェックと互換性確認が重要
      - ローリングアップデートにより、サービス停止時間を最小限に抑制

      ## バージョンアップの考慮事項
      - **Kubernetesバージョン互換性**: APIの非推奨化と削除への対応
      - **アドオンの互換性**: AWS Load Balancer Controller、EBS CSI Driver等の対応バージョン確認
      - **アプリケーションの互換性**: デプロイ済みアプリケーションの動作確認
      - **ダウンタイム**: ローリングアップデートによるサービス継続性の確保
      - **バージョンアップ後の動作確認**: すべてをバージョンアップした後にクラスタ機能の動作確認

      ## バージョンアップの大まかな手順
      - 事前準備
        - 最新バージョンのリリースノートで影響を確認する。[標準サポートの Kubernetes バージョンのリリースノートを確認する](https://docs.aws.amazon.com/ja_jp/eks/latest/userguide/kubernetes-versions-standard.html)
        - 各種アドオンについて、バージョンアップ後のクラスタに対応しているか確認する
      - バージョンアップの実施
        - kubectlコマンドをバージョンアップ
        - EKSコントロールプレーンのバージョンアップ
        - （ノードのバージョンアップ）
        - 各種アドオンのバージョンアップ

      # プラクティス

      ## 事前準備
      - 最新バージョンのリリースノートで影響を確認する
        - [標準サポートの Kubernetes バージョンのリリースノートを確認する](https://docs.aws.amazon.com/ja_jp/eks/latest/userguide/kubernetes-versions-standard.html)
        - APIの非推奨化や削除、重要な変更点をチェック
      - 各種アドオンについて、バージョンアップ後のクラスタに対応しているか確認する
        - 現在のEKSクラスタバージョンを確認する
          ```bash
          aws eks describe-cluster --name <cluster-name> --query 'cluster.version'
          ```
        - 利用可能なEKSバージョンを確認する
          ```bash
          aws eks describe-addon-versions --kubernetes-version <current-version>
          ```
        - クラスタにインストールされているアドオンとそのバージョンを確認する
          ```bash
          aws eks list-addons --cluster-name <cluster-name>
          ```
        - ArgoCD等、EKSアドオン以外もバージョンアップ後のクラスタバージョンに対応しているか確認する

      ## バージョンアップの実施
      - kubectlコマンドをバージョンアップ
        - アップグレード予定のEKSバージョンに対応するkubectlをインストール
        - kubectl バージョンは、クラスター バージョンの1つ上または下のマイナー バージョン内である必要がある
      - EKSコントロールプレーンのバージョンアップ
        - TerraformでEKSクラスタのバージョンを次のマイナーバージョンに更新する
        - 一度に複数のマイナーバージョンをスキップすることは推奨されない
        - `terraform plan`で変更内容を確認し、`terraform apply`でアップグレードを実行
        - アップグレード進行状況をAWSコンソールまたはCLIで監視する
          ```bash
          aws eks describe-update --name <cluster-name> --update-id <update-id>
          ```
      - ノードのバージョンアップ
        - EKS AutoModeの場合、コントロールプレーンアップグレード後に自動的に実行される
        - ノードのバージョンアップ完了まで待機し、進行状況を監視する
      - EKSアドオンのバージョンアップ
        - EBS CSI Driver、AWS Load Balancer Controller等のアドオンを最新バージョンにアップグレード
        - アドオンごとに互換性を確認してからアップグレードを実行
      - その他アドオンのバージョンアップ
        - ArgoCD等

      ## バージョンアップ後の動作確認
      - クラスタのステータスがACTIVEであることを確認
        ```bash
        aws eks describe-cluster --name <cluster-name> --query 'cluster.status'
        ```
      - ノードのKubeletバージョンがアップグレードされていることを確認
        ```bash
        kubectl get nodes -o wide
        ```
      - 既存のPodとサービスが正常に動作していることを確認
        ```bash
        kubectl get pods --all-namespaces
        kubectl get svc --all-namespaces
        ```
      - アプリケーションが正常にアクセス可能であることを確認

  - title: Veleroを使ったバックアップとリストア
    body: |
      # 本Issueでやること
      Kubernetesクラスタ上のアプリケーションとデータの定期的なバックアップは、災害復旧、誤操作からの回復、環境間でのデータ移行において重要です。DBなどK8s外部に保管したデータは外部サービスの機能でバックアップするのが一般的です。また、K8sリソースはマニフェストをapplyすれば再作成可能です。しかし、DVPでデプロイしたPVのボリュームやマニフェストにしていないK8sリソース（例えば、Argoのadminパスワードなど動的に作成されるリソース）は対策がいります。Veleroを使用することで、クラスタリソースとPersistent Volumeの統合的なバックアップとリストアを実現できます。

      # バックアップの必要性
      現状のバックアップ運用には、以下のような課題があります。

      ### 課題①：人的ミスから迅速に復旧できない
      - 問題点: 人的ミスによるリソース削除や設定変更が発生した際に、迅速に元の状態へ戻せない
      - 起きること: 手作業での復旧が必要となり時間がかかる、もしくは完全に元に戻せないリスクがある
      - 対応の方向性: Kubernetesリソースおよびデータをバックアップし、誤操作時にも迅速にリストアできる仕組みを導入する

      ### 課題②：ハードウェア/クラスタ障害時のデータ保護と継続性が不十分
      - 問題点: ハードウェア障害やクラスタ障害が発生した場合を想定した、データ保護および継続性が不十分
      - 起きること: 障害発生時にデータが失われ、サービス停止が長期化することで、業務やユーザーへの影響が大きくなる
      - 対応の方向性: クラスタ障害時にもデータを安全に復旧できるよう、Persistent Volumeを含めたバックアップと災害復旧手順を整備する

      ### 課題③：本番データを安全に他環境へ複製できない
      - 問題点: 本番環境のデータを開発・ステージング環境へ安全に複製するための標準的な仕組みが用意されていない
      - 起きること: 検証やテストに本番相当のデータを使用できず、環境差異による不具合の見逃しや検証品質の低下につながる
      - 対応の方向性: バックアップデータを活用し、本番データを安全に開発・ステージング環境へリストアできる運用を確立する

      ### 課題④：クラスタ移行・マルチクラスタでのデータ同期が困難
      - 問題点: クラスタ移行やマルチクラスタ構成を前提としたデータ同期・移行手段が明確に整理されていない
      - 起きること: クラスタ移行時の作業負荷が高くなり、データ不整合や移行ミスが発生するリスクが高まる
      - 対応の方向性: クラスタ間でリソースとデータを一貫して移行・同期できるバックアップ/リストア手段を導入する

      # 解決策

      ### Velero
      Kubernetesネイティブなバックアップツールであり、KubernetesリソースとPersistent Volumeを統合的に管理できる。
      災害復旧やクラスタ移行を主目的とした機能を備えており、本プラクティスではこれを採用する。

      ### etcdスナップショット
      Kubernetesコントロールプレーン（etcd）をバックアップし、クラスタ全体の状態を保存する方式。
      ただし、EKSではユーザー側での取得・管理ができない。

      ### アプリケーション固有ツール
      データベースダンプなど、アプリケーションごとに特化したバックアップ手法。
      細かな制御が可能な一方で、Kubernetes全体を横断した統合管理には向かない。

      本プラクティスでは、Kubernetes環境におけるリソースとデータを包括的にバックアップ/リストアできる仕組みとして、Veleroを採用する。

      # Veleroによるバックアップとリストア

      ### リソースバックアップ
      Deployment、Service、ConfigMapなどのKubernetesリソースをYAML定義としてバックアップする。

      ### ボリュームバックアップ
      Persistent Volumeのデータを、CSIスナップショットまたはResticを用いて保護する。

      ### 選択的バックアップ
      名前空間、ラベル、リソース種別を指定することで、必要な対象のみを柔軟にバックアップできる。

      ### スケジュールバックアップ
      cron形式による定期実行を設定し、バックアップを自動化する。

      ## Veleroの主要機能
      - **災害復旧**: クラスタ全体または特定の名前空間の完全復旧
      - **クラスタ移行**: 異なるクラスタ間でのリソースとデータの移行
      - **バックアップ検証**: バックアップの整合性確認と復旧テスト
      - **クラウド統合**: AWS S3、Azure Blob、GCS等のオブジェクトストレージとの連携

      ## VeleroのPersistent Volumeバックアップ方式
      - **CSIスナップショット**: AWS EBS、Azure Disk等のクラウドネイティブスナップショット機能を使用
      - **Restic統合**: ファイルシステムレベルでのバックアップ、クラウドに依存しない汎用的な方式
      - **File System Backup（Node Agent）**: Velero 1.10以降のrestic後継機能、より高性能な統合バックアップ

      本プラクティスではAWS EBSのCSIスナップショット機能を使用します。

      # プラクティス

      参考: [Velero実装例](https://github.com/cnc4e/cloudnative-practice/tree/main/example/velero)

      ## 事前準備
      - 以下ディレクトリを新規作成する
        - `codes/velero/terraform`
        - `codes/velero/k8s`
      - 以下リソースをTerraformで新規作成する
        - バックアップ用のS3バケット（バージョニング・暗号化・パブリックアクセスブロックを有効化）
        - Veleroサーバー用IAMロールおよびPod Identity（S3操作、EBSスナップショット操作の権限を付与）
        - EKSアドオン（snapshot-controller）の有効化
      - VolumeSnapshotClassをKubernetesリソースとして作成する
        ```yaml
        apiVersion: snapshot.storage.k8s.io/v1
        kind: VolumeSnapshotClass
        metadata:
          name: csi-aws-vsc
          labels:
            velero.io/csi-volumesnapshot-class: "true"
        driver: ebs.csi.eks.amazonaws.com
        deletionPolicy: Retain
        ```
        ```bash
        kubectl apply -f volumesnapshotclass.yaml
        kubectl get volumesnapshotclass
        ```

      ## Veleroのインストール
      - Velero CLIをインストールする
        ```bash
        curl -L https://github.com/vmware-tanzu/velero/releases/download/<version>/velero-<version>-linux-amd64.tar.gz -o velero.tar.gz
        tar -xvf velero.tar.gz
        sudo mv velero-<version>-linux-amd64/velero /usr/local/bin/
        rm -rf velero.tar.gz velero-<version>-linux-amd64/
        velero version --client-only
        ```
      - Veleroサーバーをクラスタにデプロイする（[参考](https://velero.io/docs/v1.16/basic-install/)）
      - 作成したAWSリソースが正しく設定されていることを確認する
        ```bash
        aws s3 ls | grep velero
        aws iam get-role --role-name <velero-role-name> --query 'Role.Arn' --output text
        aws eks list-pod-identity-associations --cluster-name <cluster-name> --namespace velero
        aws eks describe-addon --cluster-name <cluster-name> --addon-name snapshot-controller --query 'addon.status' --output text
        ```

      ## テスト用アプリケーションを使ったバックアップ/リストアの検証
      - PVCを使いPVを持つテスト用アプリケーションをデプロイし、適当なデータをPVに保管する
      - Veleroが正常に稼働していることを確認する
        ```bash
        kubectl get ns velero
        kubectl get pods -n velero
        velero version
        velero backup-location get
        ```
      - Veleroを使ってバックアップを作成する
        ```bash
        velero backup create <backup-name> --include-namespaces <namespace> --wait
        ```
      - バックアップ内容を検証する
        ```bash
        velero backup get
        velero backup describe <backup-name> --details
        velero backup logs <backup-name> | tail -n 100
        kubectl get volumesnapshots -A
        kubectl get volumesnapshotcontents
        ```
      - テスト用アプリケーションを削除する（名前空間を削除）
        ```bash
        kubectl delete namespace <namespace> --wait=true
        ```
      - Veleroを使ってリストアを実行する
        ```bash
        velero restore create <restore-name> --from-backup <backup-name> --wait
        ```
      - リストア結果を確認する
        ```bash
        velero restore get
        velero restore describe <restore-name> --details
        kubectl get all -n <namespace>
        kubectl get pvc -n <namespace>
        ```
      - PVに保管したデータが復元されていることを確認する
        ```bash
        kubectl exec -n <namespace> deploy/<app-name> -- cat /data/test.txt
        ```
        リストア前に書き込んだ文字列が表示されれば復元成功